[workspace]
resolver = "2"
members = [
    "crates/types",
    "crates/proto",
    "crates/backend",
    "crates/server",
    "crates/client",
    "crates/cli",
    "crates/shim",
]

[workspace.package]
edition = "2024"
# MSRV lowered from 1.94 to 1.85 (edition-2024 baseline) so the workspace
# builds with the stock Rust shipped on Alpine 3.22 (1.87), Alpine 3.23
# (>=1.91), and Amazon Linux 2023 (~1.86). See AGENTS.md rule 5 and
# doc/superpowers/specs/2026-05-20-pkcs11-proxy-ng-packaging-and-vendor-config-design.md
# for the rationale. If a build target's stock Rust is older than 1.85,
# bump this value to the smallest viable version rather than expanding the
# distro support matrix.
rust-version = "1.85"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14", features = ["tls-ring"] }
prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
libloading = "0.9"
cryptoki-sys = "0.5"
nix = { version = "0.31", features = ["socket", "user"] }
dashmap = "6"
x509-parser = "0.18"
tonic-build = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }

# Release profile tuned for size and runtime over build time. The shim
# cdylib and daemon binary shrink ~25-30%; CI build cost rises by ~30s.
[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
