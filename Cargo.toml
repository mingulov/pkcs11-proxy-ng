[workspace]
resolver = "2"
members = [
    "crates/audit",
    "crates/types",
    "crates/proto",
    "crates/backend",
    "crates/server",
    "crates/client",
    "crates/cli",
    "crates/shim",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
# MSRV raised from 1.85 to 1.88 so the workspace can use let-chains
# (`if cond && let X = e { ... }`), stabilised in Rust 1.88. The pre-
# existing codebase had 7 let-chain sites that were silently above the
# old MSRV; this version reflects reality.
#
# Distribution matrix (see AGENTS.md §5):
#   * Alpine 3.23  — stock rustc ≥ 1.91. Supported; CI uses rustup-managed
#                    stable uniformly across the Alpine matrix.
#   * Alpine 3.22  — stock rustc 1.87. Supported via the rustup-managed
#                    toolchain because stock Rust is below MSRV.
#   * Amazon Linux 2023 — stock rustc ~1.86. Below MSRV; users must
#                    install Rust via rustup or vendor toolchain.
# If a supported build target's stock Rust is older than 1.88, use a
# rustup-installed toolchain.
rust-version = "1.88"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
# tonic transport features are selected per-crate (M11), not workspace-wide, so
# the client-side artifacts (shim cdylib, client, CLI) do not link the server
# stack — axum `router`, h2/hyper `server`, socket2. Each member enables exactly
# what it uses: server → ["server","router",…]; client/CLI/proto → ["channel",…].
tonic = { version = "0.14", default-features = false }
prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
libloading = "0.8"
cryptoki-sys = "0.5"
nix = { version = "0.31", features = ["socket", "user", "fs"] }
dashmap = "6"
x509-parser = "0.18"
tonic-build = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
sha2 = "0.10"
serde_json = "1"
hex = "0.4"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
zeroize = { version = "1", features = ["derive"] }

# Release profile tuned for size and runtime over build time. The shim
# cdylib and daemon binary shrink ~25-30%; CI build cost rises by ~30s.
#
# `panic = "unwind"` is the default and MUST stay so. Several PIN/key
# handling sites in `crates/types/src/mechanism.rs` rely on
# `Drop` (`ZeroizeOnDrop`) running on unwind to zero password bytes.
# Switching to `panic = "abort"` would skip those drops and turn a
# zeroize-protected struct into a plain heap blob whose contents
# survive in the allocator's freelist.
[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
