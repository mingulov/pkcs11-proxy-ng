# cargo-deny configuration for the pkcs11-proxy-ng workspace.
#
# Run with: cargo deny check
#
# Goals (R3 security audit):
#   * Block any RustSec advisory above LOW from sneaking back in.
#   * Whitelist only OSI-approved permissive licenses that match the
#     workspace's own (Apache-2.0 OR MIT) and the existing dep tree.
#   * Block known-bad crates and copy-cats.

[graph]
# W1-L16-08: aligned with the CI clippy tree (--all-targets
# --all-features) so the feature-unified dependency graph is the one
# deny gates — a default-features-only graph would miss deps that only
# appear under --all-features.
all-features = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
# Opt into the v2 schema (cargo-deny 0.16+): vulnerability and unsound
# advisories are always hard errors, so the old per-type severity keys are
# gone. Vulnerabilities still fail the check on any advisory >= LOW.
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Treat an unmaintained-crate advisory as an error whether the crate is a
# direct or transitive dependency (R3 supply-chain hygiene). A flagged crate
# is either replaced or, if genuinely unavoidable, pinned in `ignore` with a
# written justification — never silently tolerated.
unmaintained = "all"
# A yanked release usually signals a pulled-back security or correctness
# problem, so block it rather than warn.
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses approved for the workspace's dep tree. New
# licenses appearing in transitive deps must be explicitly added here
# (and reviewed for compatibility with our Apache-2.0 OR MIT
# distribution).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
# W1-L17-27: no BSD-2-Clause / MPL-2.0 / CC0-1.0 / Unicode-DFS-2016 entries —
# all four were allowlisted-but-unused (`cargo deny check` reported each as
# license-not-encountered; the quality receipt's +1 note covered only the
# DFS entry before tree drift orphaned the other three). Verified unused in
# the root tree AND all four standalone test-workspace trees. Re-add an
# entry only with a dep that actually carries it.
# Crates that ship with no SPDX license expression in their
# Cargo.toml. Each must be reviewed individually before being added
# here; the rest of the file flags any new bare crate.
exceptions = []

# Per-crate license clarifications for crates whose Cargo.toml is
# ambiguous or whose effective license is documented in a LICENSE
# file rather than the manifest. Empty by default — populated only
# if a new dep needs it.
clarify = []

[bans]
# Reject multiple major-version copies of the same crate. Our own direct
# duplicates (e.g. libloading, aligned to cryptoki-sys's 0.8) are collapsed;
# the only remaining duplicates are ecosystem-forced transitive pins, each
# enumerated in `skip` below. With this set to `deny`, any NEW uncurated
# duplicate fails the build and forces a deliberate review.
multiple-versions = "deny"
wildcards = "deny"
# In-workspace path deps don't carry a version constraint (they
# track the workspace's own version), which cargo-deny flags as a
# wildcard. Exempt them so this rule still catches third-party
# wildcards meaningfully.
allow-wildcard-paths = true
highlight = "all"

deny = [
    # No specifically-banned crates today. Re-evaluate when adopting
    # the slow-backend mock from R2 or any new vendor extension.
]

# Ecosystem-forced duplicate versions we have reviewed and accept. They come
# from transitive dependencies that pin an older major; we cannot collapse them
# without forking upstream. Skipping the older copy leaves a single un-skipped
# version per crate, so `multiple-versions = "deny"` still fires on anything
# new. Revisit on every dependency bump: a stale skip means the duplicate it
# covered is already gone and the entry should be removed.
skip = [
    { crate = "getrandom@0.2.17" },   # 0.2 line still used across the rand stack; 0.4.x is the other
    { crate = "hashbrown@0.14.5" },   # pulled by older transitive deps; newest in tree is 0.16.x
    { crate = "hashbrown@0.15.5" },   # intermediate line, same reason
    { crate = "windows-sys@0.52.0" }, # transitive only; host target is Linux so it is never built
    # W1-L16-05 (provenance, intentionally NOT skip-listed): base64
    # 0.21.7 arrives only via hdrhistogram 7 (server dev-deps:
    # criterion 0.8 pins hdrhistogram ^7, plus the direct hdrhistogram
    # 7 bench dep); the production tree is 0.22 via tonic. itertools
    # 0.13.0 arrives only via criterion 0.8 (server dev-dep); the build
    # tree is 0.14 via prost-build. Both splits are ecosystem-forced
    # and uncollapsible without forking upstream, but deny's bans graph
    # never sees these dev-only duplicates, so skip entries for them
    # are unmatched-stale and `check bans` passes identically without
    # them — hence no entries here (a stale skip must be removed).
]

[sources]
# Only allow git and crates.io as sources. No local-path overrides in
# the workspace.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# pkcs11-module/pkcs11-abi moved to pkcs11-components; the backend consumes
# them as a rev-pinned git dependency (see crates/backend/Cargo.toml).
allow-git = ["https://github.com/mingulov/pkcs11-components"]
