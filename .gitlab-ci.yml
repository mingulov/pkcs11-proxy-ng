# Carrier-image builds for the Alpine APK and Amazon RPM targets.
#
# By-design split (W1-L17-05): full image builds (abuild/rpmbuild over a
# complete workspace compile) run ONLY here, in external GitLab — never in
# GitHub CI. The per-PR packaging signal in GitHub is the `packaging-smoke`
# job (.github/workflows/ci.yml -> scripts/packaging-smoke.sh): it pins the
# four version mirrors to the Cargo workspace version and checks the
# APKBUILD/spec shape, so version drift and packaging-file breakage fail
# fast on every PR without a second full build farm.
# Deferred T22 F6: docker images pinned by digest (tag kept for
# readability; the digest is what the runner pulls; resolved live
# 2026-09-22). Both tags share a digest — the plain tag is the dind
# image. Re-pin with the registry's current digest when moving Docker
# versions.
default:
  image: docker:28.5.2@sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac

services:
  - docker:28.5.2-dind@sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac

stages:
  - build

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  APP_VERSION: "0.2.0"

workflow:
  rules:
    # main branch builds tag as "release"; everything else gets a
    # short-sha test suffix.
    - if: '$CI_COMMIT_BRANCH == "main"'
      variables:
        IMAGE_TAG_SUFFIX: ""
        BUILD_TYPE: "Release"
    - when: always
      variables:
        IMAGE_TAG_SUFFIX: "-${CI_COMMIT_SHORT_SHA}_test"
        BUILD_TYPE: "Test"

# Shared build template for Alpine APK targets.
.alpine_build_template:
  stage: build
  script:
    - |
      set -x
      echo "Performing a ${BUILD_TYPE} build for Alpine ${ALPINE_VERSION}"
      image_name="${CI_REGISTRY}/${CI_PROJECT_PATH}:${APP_VERSION}-alpine${ALPINE_VERSION}${IMAGE_TAG_SUFFIX}"
      echo "Image will be tagged as: ${image_name}"
      echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
      docker build --progress=plain \
        --build-arg ALPINE_BUILD_IMAGE=${ALPINE_BUILD_IMAGE} \
        --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --build-arg GIT_COMMIT="${CI_COMMIT_SHA}" \
        -f packaging/alpine/Dockerfile.alpine \
        -t "${image_name}" .
      docker push "${image_name}"
      echo "Carrier image pushed to: ${image_name}"

# Shared build template for Amazon Linux RPM targets.
.amazon_build_template:
  stage: build
  script:
    - |
      set -x
      echo "Performing a ${BUILD_TYPE} build for Amazon Linux ${AMAZON_VERSION}"
      image_name="${CI_REGISTRY}/${CI_PROJECT_PATH}:${APP_VERSION}-amazon${AMAZON_VERSION}${IMAGE_TAG_SUFFIX}"
      echo "Image will be tagged as: ${image_name}"
      echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
      docker build --progress=plain \
        --build-arg AMAZON_BUILD_IMAGE=${AMAZON_BUILD_IMAGE} \
        --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --build-arg GIT_COMMIT="${CI_COMMIT_SHA}" \
        -f packaging/amazon/Dockerfile.amazon \
        -t "${image_name}" .
      docker push "${image_name}"
      echo "Carrier image pushed to: ${image_name}"

# Phase-1 matrix: Alpine 3.22, Alpine 3.23, Amazon Linux 2023.
# Older Alpine versions ship a Rust toolchain below the workspace
# MSRV (1.88); they are intentionally not part of Phase 1.

alpine_3_22:
  extends: .alpine_build_template
  variables:
    ALPINE_VERSION: "3.22"
    ALPINE_BUILD_IMAGE: "alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8"

alpine_3_23:
  extends: .alpine_build_template
  variables:
    ALPINE_VERSION: "3.23"
    ALPINE_BUILD_IMAGE: "alpine:3.23@sha256:85fe1e81d6758c208f3e1eed4338a1997e19d4be002d4dd32d3100c9a8c010a0"

amazon_2023:
  extends: .amazon_build_template
  variables:
    AMAZON_VERSION: "2023"
    AMAZON_BUILD_IMAGE: "amazonlinux:2023@sha256:74c545e3e04db388b00bd31d7cc5640d4e9c12058a6d72af938d113da3c82893"
