[package]
name = "pkcs11-proxy-ng-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
description = "Protocol messages and gRPC code generation for the PKCS#11 remote proxy"
readme = "README.md"
categories = ["cryptography", "encoding"]
keywords = ["pkcs11", "protobuf", "grpc"]
include = ["Cargo.toml", "README.md", "LICENSE-APACHE", "LICENSE-MIT", "src/**", "build.rs", "secret-fields.toml", "proto/**"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
pkcs11-proxy-ng-types = { version = "=0.2.2", path = "../types" }
# Generated stubs need `codegen`; the generated client exposes a
# `connect()`/`Channel` impl, so `channel` (client transport) is required. No
# server-side transport is referenced by the generated code.
tonic = { workspace = true, features = ["codegen", "channel"] }
tonic-prost.workspace = true
prost.workspace = true
# W1-C8-02: `Zeroize`/`ZeroizeOnDrop` derived onto secret-bearing prost
# messages in build.rs, so decoded password buffers wipe on drop.
zeroize = { workspace = true }

[build-dependencies]
tonic-prost-build.workspace = true
heck.workspace = true

[dev-dependencies]
toml = { workspace = true }

[lints]
workspace = true
