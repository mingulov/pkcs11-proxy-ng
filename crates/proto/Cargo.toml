[package]
name = "pkcs11-proxy-ng-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
pkcs11-proxy-ng-types = { path = "../types" }
# Generated stubs need `codegen`; the generated client exposes a
# `connect()`/`Channel` impl, so `channel` (client transport) is required. No
# server-side transport is referenced by the generated code.
tonic = { workspace = true, features = ["codegen", "channel"] }
tonic-prost.workspace = true
prost.workspace = true

[build-dependencies]
tonic-prost-build.workspace = true

[dev-dependencies]
toml = { workspace = true }
