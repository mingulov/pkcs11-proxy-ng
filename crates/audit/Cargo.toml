[package]
name = "pkcs11-proxy-ng-audit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
description = "Audit records and signing for the PKCS#11 remote proxy"
readme = "README.md"
categories = ["cryptography", "authentication"]
keywords = ["pkcs11", "audit", "hsm"]
include = ["Cargo.toml", "README.md", "LICENSE-APACHE", "LICENSE-MIT", "src/**"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true, features = ["zeroize"] }
thiserror = { workspace = true }
zeroize = { workspace = true }

[lints]
workspace = true
