[package]
name = "pkcs11-proxy-ng-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
pkcs11-proxy-ng-types = { path = "../types" }
pkcs11-proxy-ng-proto = { path = "../proto" }
tonic.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
# Unix-domain-socket transport (local-testing endpoint): a tower connector
# dialing a tokio UnixStream, adapted to hyper's IO traits via TokioIo.
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
