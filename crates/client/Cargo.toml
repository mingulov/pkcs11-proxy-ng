[package]
name = "pkcs11-proxy-ng-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
pkcs11-proxy-ng-types = { path = "../types" }
pkcs11-proxy-ng-proto = { path = "../proto" }
# Client side only: `channel` transport + `codegen` + `tls-ring` (mTLS client
# config). No server stack.
tonic = { workspace = true, features = ["channel", "codegen", "tls-ring"] }
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
# Unix-domain-socket transport (local-testing endpoint): a tower connector
# dialing a tokio UnixStream, adapted to hyper's IO traits via TokioIo.
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
