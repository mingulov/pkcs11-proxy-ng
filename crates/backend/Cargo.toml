[package]
name = "pkcs11-proxy-ng-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
description = "Native PKCS#11 provider backend for the remote proxy"
readme = "README.md"
categories = ["cryptography", "api-bindings"]
keywords = ["pkcs11", "backend", "hsm"]
include = ["Cargo.toml", "README.md", "LICENSE-APACHE", "LICENSE-MIT", "src/**"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[features]
# C3M.6 row 18: native-owner test-hook surface (daemon identity, mech-echo
# capture, fault injection) plus the daemon control plane. Default-off;
# normal builds must observe no hook symbols and no control listener.
native-owner-test-hooks = []

[dependencies]
pkcs11-proxy-ng-types = { version = "=0.2.0", path = "../types" }
pkcs11-proxy-ng-proto = { version = "=0.2.0", path = "../proto" }
# Shared module-FFI facts (raw acquisition, function-table layouts) from the
# published pkcs11-components crates. Default features keep `native`
# (cryptoki-sys tables + acquisition).
# W1-L16-17 RESIDUAL (P2→P3, narrowed): the crates.io release removes the
# git-URL pin, but pkcs11-module remains a single-maintainer dependency with
# no org-owned mirror. Fallback plan, in order: (1) re-publish or mirror the
# crates and re-point this version requirement; (2) vendor the crate in-tree
# behind a [patch] section.
pkcs11-module = "0.2"
libloading.workspace = true
cryptoki-sys.workspace = true
tracing.workspace = true
zeroize = { workspace = true }
dashmap = { workspace = true }

[lints]
workspace = true
