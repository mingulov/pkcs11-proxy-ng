[package]
name = "pkcs11-proxy-ng-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "pkcs11-proxy-ng-cli"
path = "src/main.rs"

[dependencies]
pkcs11-proxy-ng-types = { path = "../types" }
pkcs11-proxy-ng-client = { path = "../client" }
pkcs11-proxy-ng-audit = { path = "../audit" }
clap.workspace = true
tokio.workspace = true
# CLI is a gRPC client: `channel` transport + `codegen` + `tls-ring`. No server.
tonic = { workspace = true, features = ["channel", "codegen", "tls-ring"] }
tonic-health.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hex = "0.4"
base64 = "0.22"
x509-parser.workspace = true

# Test-only: spin an in-process mock daemon so handler tests cover the full
# client -> gRPC -> backend path. Never linked into the shipped CLI binary.
[dev-dependencies]
pkcs11-proxy-ng = { path = "../server" }
pkcs11-proxy-ng-backend = { path = "../backend" }
pkcs11-proxy-ng-proto = { path = "../proto" }
tokio-stream = "0.1"
tonic = { workspace = true, features = ["server"] }
tempfile = "3"
rcgen = "0.14"
