[package]
name = "pkcs11-proxy-ng-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "pkcs11-proxy-ng-cli"
path = "src/main.rs"

[dependencies]
pkcs11-proxy-ng-types = { path = "../types" }
pkcs11-proxy-ng-client = { path = "../client" }
pkcs11-proxy-ng-audit = { path = "../audit" }
clap.workspace = true
tokio.workspace = true
# CLI is a gRPC client: `channel` transport + `codegen` + `tls-ring`. No server.
tonic = { workspace = true, features = ["channel", "codegen", "tls-ring"] }
tonic-health.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hex = "0.4"
base64 = "0.22"
x509-parser.workspace = true
