[package]
name = "pkcs11-proxy-ng-shim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "pkcs11_proxy_ng_shim"
# cdylib: the deployable PKCS#11 shared library
# rlib: enables `cargo test` for #[cfg(test)] modules within the crate
crate-type = ["cdylib", "rlib"]

[dependencies]
pkcs11-proxy-ng-types = { path = "../types" }
pkcs11-proxy-ng-client = { path = "../client" }
pkcs11-proxy-ng-proto = { path = "../proto" }
cryptoki-sys.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
pkcs11-proxy-ng-backend = { path = "../backend" }
pkcs11-proxy-ng = { path = "../server" }
pkcs11-proxy-ng-proto = { path = "../proto" }
tokio-stream = "0.1"
# Dev-only: the output-semantics test spins up an in-process `Server` and dials
# it, so the test harness needs the full transport (server + channel). The shim
# release cdylib does not depend on tonic — it talks to the daemon via `client`.
tonic = { workspace = true, features = ["transport", "router", "codegen", "tls-ring"] }
libc = "0.2"
# Dev-only: the registry-drift test captures WARN output via a fmt subscriber.
tracing-subscriber.workspace = true
# Dev-only: the stock-SoftHSM2 test provisions an isolated token dir + config.
tempfile = "3"
# Dev-only: the cross_width_smoke example loads the built shim module through
# the public C ABI (C_GetFunctionList), exactly like a host application.
libloading.workspace = true
