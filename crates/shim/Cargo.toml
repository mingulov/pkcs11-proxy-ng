[package]
name = "pkcs11-proxy-ng-shim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
description = "PKCS#11 C ABI shim for the remote proxy"
readme = "README.md"
categories = ["cryptography", "api-bindings"]
keywords = ["pkcs11", "shim", "hsm"]
include = ["Cargo.toml", "README.md", "LICENSE-APACHE", "LICENSE-MIT", "src/**", "examples/cross_width_smoke.rs"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
name = "pkcs11_proxy_ng_shim"
# cdylib: the deployable PKCS#11 shared library
# rlib: enables `cargo test` for #[cfg(test)] modules within the crate
crate-type = ["cdylib", "rlib"]

[dependencies]
pkcs11-proxy-ng-types = { version = "=0.2.1", path = "../types" }
pkcs11-proxy-ng-client = { version = "=0.2.1", path = "../client" }
pkcs11-proxy-ng-proto = { version = "=0.2.1", path = "../proto" }
cryptoki-sys.workspace = true
# W1-L16-15: minimal cdylib closure — current-thread runtime + sync/time/net.
# No signal/process (verified via `cargo tree -p pkcs11-proxy-ng-shim`).
tokio = { workspace = true, features = ["rt", "sync", "time", "net", "macros"] }
tracing.workspace = true

[dev-dependencies]
pkcs11-proxy-ng-backend = { path = "../backend" }
pkcs11-proxy-ng = { path = "../server" }
pkcs11-proxy-ng-proto = { path = "../proto" }
tokio-stream = "0.1"
# Dev-only: the output-semantics test spins up an in-process `Server` and dials
# it, so the test harness needs the full transport (server + channel). The shim
# release cdylib does not depend on tonic — it talks to the daemon via `client`.
tonic = { workspace = true, features = ["transport", "router", "codegen", "tls-ring"] }
libc = "0.2"
# Dev-only: the registry-drift test captures WARN output via a fmt subscriber.
tracing-subscriber.workspace = true
# Dev-only: the stock-SoftHSM2 test provisions an isolated token dir + config.
tempfile = "3"
# Dev-only: the cross_width_smoke example loads the built shim module through
# the public C ABI (C_GetFunctionList), exactly like a host application.
libloading.workspace = true
# Dev-only: the ABI audit walks the served function-list tables with the
# shared module-FFI offset facts (W1-L10-14). Same crates.io version as the
# backend.
pkcs11-module = "0.2"

[lints]
workspace = true
