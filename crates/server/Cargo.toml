[package]
name = "pkcs11-proxy-ng"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "pkcs11-proxy-ng"
path = "src/main.rs"

[features]
# C3M.6 row 18: hook-gated daemon control plane + backend test-hook
# surface. Default-off; normal builds observe no control listener and
# fail closed if [test_hooks] is configured.
native-owner-test-hooks = ["pkcs11-proxy-ng-backend/native-owner-test-hooks"]

[dependencies]
pkcs11-proxy-ng-types = { path = "../types" }
pkcs11-proxy-ng-proto = { path = "../proto" }
pkcs11-proxy-ng-backend = { path = "../backend" }
pkcs11-proxy-ng-audit = { path = "../audit" }
cryptoki-sys.workspace = true
serde_json.workspace = true
clap.workspace = true
# Daemon: server-side transport (`Server::builder().add_service`) needs `server`
# + `router`; `codegen` for the generated service trait; `tls-ring` for mTLS.
tonic = { workspace = true, features = ["server", "router", "codegen", "tls-ring"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
toml.workspace = true
uuid.workspace = true
nix.workspace = true
dashmap.workspace = true
x509-parser.workspace = true
tonic-health.workspace = true
sha2.workspace = true
hex.workspace = true
zeroize.workspace = true
tokio-stream = "0.1"
tower = "0.5"
tower-layer = "0.3"
tower-service = "0.3"
futures = "0.3"
http = "1"

[dev-dependencies]
pkcs11-proxy-ng-client = { path = "../client" }
libloading.workspace = true
tempfile = "3"
rcgen = "0.14"
time = "0.3"
criterion = { version = "0.8", features = ["async_tokio"] }
libc = "0.2"
serde_json = "1"
hdrhistogram = "7"
prost = { workspace = true }

[[bench]]
name = "proxy_benchmark"
harness = false

[[bench]]
name = "proxy_latency_histogram"
harness = false

[[bench]]
name = "proxy_throughput"
harness = false

[[bench]]
name = "registry_payload_size"
harness = false
