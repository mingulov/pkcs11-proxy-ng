[package]
name = "pkcs11-proxy-ng"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "pkcs11-proxy-ng"
path = "src/main.rs"

[dependencies]
pkcs11-proxy-ng-types = { path = "../types" }
pkcs11-proxy-ng-proto = { path = "../proto" }
pkcs11-proxy-ng-backend = { path = "../backend" }
clap.workspace = true
tonic.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
toml.workspace = true
uuid.workspace = true
nix.workspace = true
dashmap.workspace = true
x509-parser.workspace = true
tonic-health.workspace = true
sha2.workspace = true
zeroize.workspace = true
tokio-stream = "0.1"
tower = "0.5"
tower-layer = "0.3"
tower-service = "0.3"
futures = "0.3"
http = "1"

[dev-dependencies]
pkcs11-proxy-ng-client = { path = "../client" }
cryptoki-sys.workspace = true
libloading.workspace = true
tempfile = "3"
rcgen = "0.14"
time = "0.3"
criterion = { version = "0.8", features = ["async_tokio"] }
libc = "0.2"
serde_json = "1"
hdrhistogram = "7"
prost = { workspace = true }

[[bench]]
name = "proxy_benchmark"
harness = false

[[bench]]
name = "proxy_latency_histogram"
harness = false

[[bench]]
name = "proxy_throughput"
harness = false

[[bench]]
name = "registry_payload_size"
harness = false
