# GUI-dispatched release orchestrator: verify, cut, dispatch.
#
# One dispatch carries the whole pre-publication path from the Actions
# tab: this workflow verifies the eight receipt gates plus
# subject/version/CHANGELOG/tag preconditions on main, cuts an
# approval-gated receipt-only commit with an annotated tag, waits for
# green CI on the new tag, then dispatches publish.yml with the inputs
# passed through once. Upload and release approvals still gate their
# own environments inside publish/release; nothing here bypasses them.
#
# Prerequisites (maintainer, one-time): create the `release-tag`
# environment with required reviewers. The cut job pushes with
# GITHUB_TOKEN, which works while main is unprotected; protecting
# main later requires an App token with bypass for that job instead
# (see the publication guide).
#
# Recovery: every partial state has a manual path. Tag pushed but
# publish never dispatched -> wait for green tag CI, then dispatch
# publish.yml by hand. Commit pushed but tag missing -> push the
# annotated tag by hand, then dispatch. Tag exists -> this workflow
# refuses (tags are never moved).

name: cut-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'release version, e.g. X.Y.Z (stable only)'
        required: true
      mode:
        description: 'publish mode to dispatch after tagging'
        required: false
        default: dry-run
        type: choice
        options:
          - dry-run
          - bootstrap
          - trusted
      package:
        description: 'workspace or exactly one of the eight crate names'
        required: false
        default: workspace
      qualification-url:
        description: 'HTTPS qualification record URL (upload modes)'
        required: false
      qualification-subject:
        description: 'frozen-subject SHA (upload modes)'
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release gates on main
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    outputs:
      verified_sha: ${{ steps.record.outputs.verified_sha }}
      tag: ${{ steps.record.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      # R10 (S2 §11): the test-only v1-enable cfg must never reach packaged
      # artifacts. Fail loudly if RUSTFLAGS carries it.
      - name: Reject test-only mechanism-params cfg
        run: |
          set -euo pipefail
          if [[ "${RUSTFLAGS:-}" == *"pkcs11_proxy_test_mechanism_params_v1"* ]]; then
            echo "::error::RUSTFLAGS carries the test-only cfg pkcs11_proxy_test_mechanism_params_v1; refusing."
            exit 1
          fi

      - name: Validate inputs and record subject
        id: record
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$VERSION' is not MAJOR.MINOR.PATCH; refusing."
            exit 1
          fi
          if [[ "${{ inputs.mode }}" != "dry-run" ]]; then
            if [[ -z "${{ inputs.qualification-url }}" || -z "${{ inputs.qualification-subject }}" ]]; then
              echo "::error::upload modes require qualification-url and qualification-subject."
              exit 1
            fi
            if [[ ! "${{ inputs.qualification-subject }}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::qualification-subject is not a 40-hex SHA."
              exit 1
            fi
          fi
          TAG="v$VERSION"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "::error::tag $TAG already exists; tags are never moved."
            exit 1
          fi
          echo "verified_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Isolate Cargo directories
        run: |
          set -euo pipefail
          echo "CARGO_BUILD_BUILD_DIR=$RUNNER_TEMP/cut-verify/build" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cut-verify/target" >> "$GITHUB_ENV"

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Install protoc (pinned, matches mise.toml)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "36.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust 1.88.0 (MSRV gate)
        run: rustup toolchain install 1.88.0 --profile minimal --component rustc,cargo

      - name: Gate fmt
        run: cargo fmt --all -- --check

      - name: Gate check
        run: cargo check --workspace --locked --all-targets

      - name: Gate test
        run: cargo test --workspace --locked

      - name: Gate clippy
        run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings

      - name: Gate msrv
        run: cargo +1.88.0 check --workspace --locked

      - name: Cache cargo audit binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.22.2

      - name: Gate audit
        run: |
          set -euo pipefail
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi
          cargo audit
          scripts/audit-test-workspaces.sh audit

      - name: Cache cargo deny binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny-0.20.2

      - name: Gate deny
        run: |
          set -euo pipefail
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install cargo-deny --version 0.20.2 --locked
          fi
          cargo deny check
          scripts/audit-test-workspaces.sh deny

      - name: Gate release_dry_run
        run: scripts/release-dry-run.sh

      - name: Check subject and version
        run: |
          set -euo pipefail
          # verify-release-subject asserts the tag shape, the Cargo
          # version mirror, the CHANGELOG.md dated heading, and the four
          # packaging mirrors; it needs no pushed tag to check those.
          # A receipt already on main is fine: the tag commit refreshes
          # it in place (rule (b) allows add or modify).
          scripts/verify-release-subject.sh "${{ steps.record.outputs.tag }}"

      - name: Write quality receipt
        run: |
          set -euo pipefail
          python3 scripts/release_checks.py write-receipt \
            --version "${{ inputs.version }}" \
            --subject-sha "${{ steps.record.outputs.verified_sha }}" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output "doc/release/v${{ inputs.version }}-quality-receipt.md"

      - name: Upload receipt artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-receipt
          path: doc/release/v${{ inputs.version }}-quality-receipt.md
          retention-days: 90
          overwrite: false
          if-no-files-found: error

  cut:
    name: Cut receipt commit and tag (approval-gated)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    needs: [verify]
    environment: release-tag
    permissions:
      contents: write
      actions: write
    outputs:
      tag: ${{ needs.verify.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Re-verify subject and tag absence
        run: |
          set -euo pipefail
          # Main may have moved during the approval wait; the receipt binds
          # the verified SHA, so any drift refuses here.
          HEAD="$(git rev-parse HEAD)"
          if [[ "$HEAD" != "${{ needs.verify.outputs.verified_sha }}" ]]; then
            echo "::error::HEAD $HEAD moved past verified ${{ needs.verify.outputs.verified_sha }}."
            exit 1
          fi
          TAG="${{ needs.verify.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "::error::tag $TAG appeared meanwhile; tags are never moved."
            exit 1
          fi

      - name: Download receipt artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-receipt
          path: cut-receipt

      - name: Commit receipt-only delta
        run: |
          set -euo pipefail
          shopt -s nullglob
          RECEIPT="doc/release/v${{ inputs.version }}-quality-receipt.md"
          found=(cut-receipt/*.md)
          if [[ "${#found[@]}" -ne 1 ]]; then
            echo "::error::expected exactly one receipt file."
            exit 1
          fi
          cp "${found[0]}" "$RECEIPT"
          state="$(git status --porcelain -- "$RECEIPT")"
          if [[ "$state" != "?? $RECEIPT" && "$state" != " M $RECEIPT" ]]; then
            echo "::error::unexpected worktree state for $RECEIPT."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$RECEIPT"
          git commit -m "Record v${{ inputs.version }} quality receipt"

      - name: Verify receipt before tag
        run: |
          set -euo pipefail
          scripts/verify-quality-receipt.sh "${{ needs.verify.outputs.tag }}"

      - name: Create annotated tag
        run: |
          set -euo pipefail
          TAG="${{ needs.verify.outputs.tag }}"
          git tag -a "$TAG" -m "pkcs11-proxy-ng $TAG"

      - name: Push commit and tag
        run: |
          set -euo pipefail
          # Plain pushes only: the re-verify above refuses drift, and a
          # concurrent push races instead of overwriting. Tags are never
          # moved, and main stays append-only from this job.
          git push origin main
          git push origin "${{ needs.verify.outputs.tag }}"

      - name: Start CI on the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Token pushes trigger no runs, so the tag commit would never
          # get CI: start it explicitly. Publish refuses until the
          # aggregate on this commit is green.
          gh workflow run ci.yml \
            --ref "${{ needs.verify.outputs.tag }}" \
            -R "${{ github.repository }}"

  dispatch-publish:
    name: Dispatch publish.yml
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    needs: [cut]
    permissions:
      contents: read
      actions: write
      checks: read
    steps:
      # Publish preflight refuses without the green aggregate, so
      # dispatching before tag CI finishes only produces a spurious
      # failed publish run. Wait here instead: conclusions are pinned
      # to success-only (a skipped aggregate must refuse), and the job
      # timeout bounds the wait.
      - name: Wait for green CI on the new tag
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ needs.cut.outputs.tag }}
          check-name: "CI success (fail-closed aggregate)"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          allowed-conclusions: success
          wait-interval: 60
          # Discovery covers the whole tag-CI run: the aggregate check
          # only appears once all CI jobs finish (~30-40 min), and the
          # action fatally exits if the named check never appears
          # within this window (cut-release run 37309689377).
          checks-discovery-timeout: 3600

      - name: Dispatch publish from the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run publish.yml \
            --ref "${{ needs.cut.outputs.tag }}" \
            -R "${{ github.repository }}" \
            -f mode="${{ inputs.mode }}" \
            -f package="${{ inputs.package }}" \
            -f tag="${{ needs.cut.outputs.tag }}" \
            -f qualification-url="${{ inputs.qualification-url }}" \
            -f qualification-subject="${{ inputs.qualification-subject }}"
