# Tier 2-3 — Provider-matrix and consumer interoperability
#
# Scheduled nightly and dispatchable manually.  Runs the full test matrix
# inside Dockerfile.test using SoftHSM2, NSS softokn, Kryoptic, pkcs11-tool,
# p11tool, and optionally OpenSSL pkcs11-provider.
#
# This job is intentionally NOT a PR gate:
#   - It requires Docker, SoftHSM2, and consumer tool installation.
#   - It takes several minutes to build Kryoptic from source.
#   - Failures here indicate real compatibility regressions and must be
#     investigated, but they should not block unrelated PRs.
#
# Failed runs upload their log artifacts so the full output is inspectable
# without re-running.
#
# Test tiers exercised here:
#   Tier 2: real-module workflow tests (SoftHSM2, NSS, Kryoptic)
#   Tier 3: consumer interoperability (pkcs11-tool, p11tool, OpenSSL pkcs11prov)
#   Tier 4: multi-client, restart, and failure-path tests (#[ignore] suite)
#
# Tier 0 checks are NOT duplicated here — they run on every PR via ci.yml.

name: Nightly provider matrix

on:
  schedule:
    # 03:00 UTC every day
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      skip_consumers:
        description: "Skip consumer interoperability smoke tests"
        required: false
        default: "false"
        type: boolean
      skip_optional_providers:
        description: "Skip NSS and Kryoptic suites (run SoftHSM2 only)"
        required: false
        default: "false"
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  provider-matrix:
    name: Provider matrix (Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build test image
        run: |
          docker buildx build \
            --file Dockerfile.test \
            --tag pkcs11-proxy-ng-test:ci \
            --load \
            --cache-from type=gha \
            --cache-to   type=gha,mode=max \
            .

      # Dispatch inputs are boolean strings controlled by the workflow operator.
      # They are placed in environment variables and compared in shell — never
      # interpolated directly into a command string.
      - name: Run test matrix inside container
        env:
          SKIP_CONSUMERS: ${{ github.event.inputs.skip_consumers }}
          SKIP_OPTIONAL_PROVIDERS: ${{ github.event.inputs.skip_optional_providers }}
        run: |
          FLAGS="--skip-fast"
          if [[ "${SKIP_CONSUMERS}" == "true" ]]; then
            FLAGS="${FLAGS} --skip-consumers"
          fi
          if [[ "${SKIP_OPTIONAL_PROVIDERS}" == "true" ]]; then
            FLAGS="${FLAGS} --skip-optional-providers"
          fi
          # shellcheck disable=SC2086
          docker run --rm \
            --name pkcs11-proxy-ng-matrix \
            pkcs11-proxy-ng-test:ci \
            bash scripts/test-matrix.sh ${FLAGS} \
            2>&1 | tee matrix-run.log

      - name: Upload matrix log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: matrix-log-${{ github.run_id }}
          path: matrix-run.log
          retention-days: 14

  # ── Tier 0 sanity on the same commit ──────────────────────────────────────
  # Re-run fast checks in the nightly job so nightly also acts as an
  # independent regression signal for unit tests.
  fast-checks:
    name: Tier 0 sanity (nightly)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install protoc (pinned, matches mise.toml)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          # W1-L16-13: single protoc version everywhere; must match
          # mise.toml.
          version: "36.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned toolchain with components
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          components: rustfmt,clippy

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-nightly-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-nightly-

      - name: Install cargo-deny
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install cargo-deny --version 0.20.2 --locked
          fi

      - name: Tier 0 checks
        run: |
          cargo fmt --all -- --check
          cargo deny check
          cargo build --workspace --locked
          cargo test --workspace --locked
          cargo clippy --workspace --locked --all-targets --all-features -- -D warnings

  # ── Live cross-width topology matrix ─────────────────────────────────────
  # Runs the real-binary width harness (ADR-0011): daemons + SoftHSM2 over
  # localhost TCP. The runner gets both the 64-bit SoftHSM2 package and the
  # extracted i386 library, so all four Linux legs run (32c/64b, 64/64,
  # 64c/32b reverse bridge + D4, 32/32), plus the two NSS32 legs below
  # (64c/32b + 32/32 against i386 softokn). The wine smokes skip cleanly
  # here (no wine image on the runner) and remain host-run scripts.
  cross-width-live:
    name: Live cross-width matrix (SoftHSM2)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y softhsm2 \
            gcc-multilib libc6-dev-i386 libnss3-tools
          # The i386 SoftHSM2 library conflicts with the amd64 package on
          # the compat symlink; extract it beside the system instead.
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          apt-get download libsofthsm2:i386
          sudo mkdir -p /opt/softhsm2-i386
          sudo dpkg -x libsofthsm2_*i386.deb /opt/softhsm2-i386/
          # Second 32-bit provider leg (NSS i386): libsoftokn3 needs its
          # i386 closure (libnspr4 for libnspr4/libplc4/libplds4,
          # libsqlite3-0 for libsqlite3) extracted beside it, and the
          # NSS32 script builds its fixture DB with certutil (above).
          apt-get download libnss3:i386 libnspr4:i386 libsqlite3-0:i386
          sudo mkdir -p /opt/nss32-i386
          sudo dpkg -x libnss3_*i386.deb /opt/nss32-i386/
          sudo dpkg -x libnspr4_*i386.deb /opt/nss32-i386/
          sudo dpkg -x libsqlite3-0_*i386.deb /opt/nss32-i386/

      - name: Install protoc (pinned, matches mise.toml)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          # W1-L16-13: single protoc version everywhere; must match
          # mise.toml.
          version: "36.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned toolchain with i686 target
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          targets: i686-unknown-linux-gnu

      - name: Build release daemon
        run: cargo build --locked --release -p pkcs11-proxy-ng

      - name: Run live tier
        run: scripts/run-test-tiers.sh live

  # ── Coverage report ───────────────────────────────────────────────────────
  # Report-only (no hard threshold yet): measures line coverage across the
  # workspace lib suites and uploads the lcov + summary as artifacts so
  # coverage drift is visible run to run.
  coverage:
    name: Coverage (cargo-llvm-cov)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install protoc (pinned, matches mise.toml)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          # W1-L16-13: single protoc version everywhere; must match
          # mise.toml.
          version: "36.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned toolchain with llvm-tools
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@166cdddc0349c6f3c1da17f66a8fc88ec3bc4dd5 # cargo-llvm-cov

      - name: cargo llvm-cov (workspace)
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tee coverage-summary.txt

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: |
            lcov.info
            coverage-summary.txt

  # ── Miri (undefined-behavior interpreter) ─────────────────────────────────
  # Runs the pure width/translation logic and the shim's unsafe parse paths
  # (mechanism/message param readers, template input parsing) under Miri.
  # Tests that need real time/FFI are already `cfg_attr(miri, ignore)`d.
  miri:
    name: Miri (types + shim parse paths)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install protoc (pinned, matches mise.toml)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          # W1-L16-13: single protoc version everywhere; must match
          # mise.toml.
          version: "36.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install nightly toolchain with miri
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: nightly
          components: miri

      # Scope notes (measured 2026-07-04): the FULL types suite takes ~2.5 h
      # under Miri (TOML/serde interpretation dominates) and its registry
      # tests use real fs (cfg_attr(miri, ignore)). The width/attribute
      # modules are the UB-relevant pure logic. On the shim, the daemon-based
      # tests:: modules need real sockets and are compiled out under Miri
      # (lib.rs cfg); the raw-pointer parse paths below are the point.
      - name: cargo miri test (width/attribute logic + shim parse paths)
        run: |
          cargo +nightly miri test -p pkcs11-proxy-ng-types -- width attribute
          cargo +nightly miri test -p pkcs11-proxy-ng-shim --lib -- \
            dispatch::general::width_bridge \
            dispatch::general::helpers::nested_template_input \
            not_wild_read
