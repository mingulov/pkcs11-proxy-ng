# Tier 2-3 — Provider-matrix and consumer interoperability
#
# Scheduled nightly and dispatchable manually.  Runs the full test matrix
# inside Dockerfile.test using SoftHSM2, NSS softokn, Kryoptic, pkcs11-tool,
# p11tool, and optionally OpenSSL pkcs11-provider.
#
# This job is intentionally NOT a PR gate:
#   - It requires Docker, SoftHSM2, and consumer tool installation.
#   - It takes several minutes to build Kryoptic from source.
#   - Failures here indicate real compatibility regressions and must be
#     investigated, but they should not block unrelated PRs.
#
# Failed runs upload their log artifacts so the full output is inspectable
# without re-running.
#
# Test tiers exercised here:
#   Tier 2: real-module workflow tests (SoftHSM2, NSS, Kryoptic)
#   Tier 3: consumer interoperability (pkcs11-tool, p11tool, OpenSSL pkcs11prov)
#   Tier 4: multi-client, restart, and failure-path tests (#[ignore] suite)
#
# Tier 0 checks are NOT duplicated here — they run on every PR via ci.yml.

name: Nightly provider matrix

on:
  schedule:
    # 03:00 UTC every day
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      skip_consumers:
        description: "Skip consumer interoperability smoke tests"
        required: false
        default: "false"
        type: boolean
      skip_optional_providers:
        description: "Skip NSS and Kryoptic suites (run SoftHSM2 only)"
        required: false
        default: "false"
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  provider-matrix:
    name: Provider matrix (Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        run: |
          docker buildx build \
            --file Dockerfile.test \
            --tag pkcs11-proxy-ng-test:ci \
            --load \
            --cache-from type=gha \
            --cache-to   type=gha,mode=max \
            .

      # Dispatch inputs are boolean strings controlled by the workflow operator.
      # They are placed in environment variables and compared in shell — never
      # interpolated directly into a command string.
      - name: Run test matrix inside container
        env:
          SKIP_CONSUMERS: ${{ github.event.inputs.skip_consumers }}
          SKIP_OPTIONAL_PROVIDERS: ${{ github.event.inputs.skip_optional_providers }}
        run: |
          FLAGS="--skip-fast"
          if [[ "${SKIP_CONSUMERS}" == "true" ]]; then
            FLAGS="${FLAGS} --skip-consumers"
          fi
          if [[ "${SKIP_OPTIONAL_PROVIDERS}" == "true" ]]; then
            FLAGS="${FLAGS} --skip-optional-providers"
          fi
          # shellcheck disable=SC2086
          docker run --rm \
            --name pkcs11-proxy-ng-matrix \
            pkcs11-proxy-ng-test:ci \
            bash scripts/test-matrix.sh ${FLAGS} \
            2>&1 | tee matrix-run.log

      - name: Upload matrix log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-log-${{ github.run_id }}
          path: matrix-run.log
          retention-days: 14

  # ── Tier 0 sanity on the same commit ──────────────────────────────────────
  # Re-run fast checks in the nightly job so nightly also acts as an
  # independent regression signal for unit tests.
  fast-checks:
    name: Tier 0 sanity (nightly)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler

      - name: Install stable toolchain with components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-nightly-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-nightly-

      - name: Tier 0 checks
        run: |
          cargo fmt --all -- --check
          cargo build --workspace
          cargo test --workspace
          cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ── Live cross-width topology matrix ─────────────────────────────────────
  # Runs the real-binary width harness (ADR-0011): daemons + SoftHSM2 over
  # localhost TCP. The runner gets both the 64-bit SoftHSM2 package and the
  # extracted i386 library, so all four Linux legs run (32c/64b, 64/64,
  # 64c/32b reverse bridge + D4, 32/32), plus the two NSS32 legs below
  # (64c/32b + 32/32 against i386 softokn). The wine smokes skip cleanly
  # here (no wine image on the runner) and remain host-run scripts.
  cross-width-live:
    name: Live cross-width matrix (SoftHSM2)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler softhsm2 \
            gcc-multilib libc6-dev-i386 libnss3-tools
          # The i386 SoftHSM2 library conflicts with the amd64 package on
          # the compat symlink; extract it beside the system instead.
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          apt-get download libsofthsm2:i386
          sudo mkdir -p /opt/softhsm2-i386
          sudo dpkg -x libsofthsm2_*i386.deb /opt/softhsm2-i386/
          # libsofthsm2's runtime closure (2026-09-20 first CI run: the
          # 32-bit daemon failed to start on missing libcrypto.so.3).
          # libssl3t64 = OpenSSL 3 (t64 transition name); libstdc++6/libgcc-s1
          # for the C++ runtime. libc6:i386 is already on the runner image.
          apt-get download libssl3t64:i386 libstdc++6:i386 libgcc-s1:i386
          sudo dpkg -x libssl3t64_*i386.deb /opt/softhsm2-i386/
          sudo dpkg -x libstdc++6_*i386.deb /opt/softhsm2-i386/
          sudo dpkg -x libgcc-s1_*i386.deb /opt/softhsm2-i386/
          # Second 32-bit provider leg (NSS i386): libsoftokn3 needs its
          # i386 closure (libnspr4 for libnspr4/libplc4/libplds4,
          # libsqlite3-0 for libsqlite3) extracted beside it, and the
          # NSS32 script builds its fixture DB with certutil (above).
          apt-get download libnss3:i386 libnspr4:i386 libsqlite3-0:i386
          sudo mkdir -p /opt/nss32-i386
          sudo dpkg -x libnss3_*i386.deb /opt/nss32-i386/
          sudo dpkg -x libnspr4_*i386.deb /opt/nss32-i386/
          sudo dpkg -x libsqlite3-0_*i386.deb /opt/nss32-i386/

      - name: Install stable toolchain with i686 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu

      - name: Build release daemon
        run: cargo build --release -p pkcs11-proxy-ng

      - name: Run live tier
        run: scripts/run-test-tiers.sh live

  # ── Coverage report ───────────────────────────────────────────────────────
  # Report-only (no hard threshold yet): measures line coverage across the
  # workspace lib suites and uploads the lcov + summary as artifacts so
  # coverage drift is visible run to run.
  coverage:
    name: Coverage (cargo-llvm-cov)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler

      - name: Install stable toolchain with llvm-tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: cargo llvm-cov (workspace)
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tee coverage-summary.txt

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            lcov.info
            coverage-summary.txt

  # ── Miri (undefined-behavior interpreter) ─────────────────────────────────
  # Runs the pure width/translation logic and the shim's unsafe parse paths
  # (mechanism/message param readers, template input parsing) under Miri.
  # Tests that need real time/FFI are already `cfg_attr(miri, ignore)`d.
  miri:
    name: Miri (types + shim parse paths)
    runs-on: ubuntu-24.04
    # 2026-09-20: 45 -> 60 headroom for the two added reader tests (~15 min
    # each under Miri on a loaded box; far less on an idle runner).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler

      - name: Install nightly toolchain with miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      # Scope notes (measured 2026-07-04): the FULL types suite takes ~2.5 h
      # under Miri (TOML/serde interpretation dominates) and its registry
      # tests use real fs (cfg_attr(miri, ignore)). The width/attribute
      # modules are the UB-relevant pure logic (36 tests, ~7 s, green).
      # On the shim, the daemon-based tests:: modules need real sockets and
      # are compiled out under Miri (lib.rs cfg).
      # 2026-09-20 first run: Miri serializes tests and some parse tests are
      # pathologically slow (reads_rsa_wrap 41 min, pbe not_wild_read 12 min),
      # so the shim scope is the two seconds-proven parse tests below, each
      # exact-named and timeout-guarded. Dropped: width_bridge (18 tests, 100%
      # safe code — the only "unsafe" is a comment — still covered by the
      # native tiers), the stale nested_template_input filter (matches
      # nothing), and the slow readers (follow-up: re-scope post-D4-S3 fix).
      # The guilty LLP64 pack(1) layout runs in miri-windows below.
      - name: cargo miri test (width/attribute logic + shim parse paths)
        run: |
          cargo +nightly miri test -p pkcs11-proxy-ng-types -- width attribute
          timeout 600 cargo +nightly miri test -p pkcs11-proxy-ng-shim --lib -- \
            --exact dispatch::general::helpers::mechanism_parameter_tests::gcm_aad_unmaterializable_len_rejected_not_wild_read
          timeout 600 cargo +nightly miri test -p pkcs11-proxy-ng-shim --lib -- \
            --exact dispatch::general::helpers::mechanism_parameter_tests::reads_handle_string_and_sign_context_parameter_structs

  # ── Miri on Windows (pack(1) UB sites) ────────────────────────────────────
  # Same nightly cadence as the Linux Miri job above. Runs ONLY the two
  # reader tests covering the audit-flagged 8-byte loads
  # (mechanism_read.rs:930-932 rsa_aes_key_wrap, :990 sign_additional_context):
  # on LLP64 pack(1) the pointer fields sit at offset 4 (misaligned), while
  # on LP64 they sit at offset 8 (aligned) — so only this leg can trip them.
  # Scoped to 2 tests deliberately: full-file Miri runs take hours (measured
  # ~15 min/test on a loaded box); broad parse-path coverage stays on Linux.
  # Needs the MSVC dev environment (ring's C build) plus protoc, like the
  # cross-platform win32 leg. Miri interprets and never links, but the PATH
  # export below is still required: git-bash prepends /usr/bin (GNU link.exe)
  # ahead of the dev-cmd MSVC dirs in every fresh shell, and cc-rs build
  # scripts (ring) resolve link.exe via PATH (same mechanism as win32).
  miri-windows:
    name: Miri (Windows pack(1) UB sites)
    runs-on: windows-2022
    # 120 not 60: while red this trips in seconds, but post-D4-S3-fix passing
    # runs inherit the Linux-measured ~45-min class (reads_rsa_wrap: 41 min).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          # Same rate-limit hardening as the cross-platform legs.
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install nightly toolchain with miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Set up x64 MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: Windows-X64-cargo-miri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            Windows-X64-cargo-miri-

      - name: cargo miri test (pack(1) UB-site readers)
        run: |
          MSVC_BINDIR="$(dirname "$(which cl)")"
          export PATH="$MSVC_BINDIR:$PATH"
          cargo +nightly miri test -p pkcs11-proxy-ng-shim --lib -- \
            reads_rsa_wrap_parameter_structs \
            reads_handle_string_and_sign_context_parameter_structs
        shell: bash
