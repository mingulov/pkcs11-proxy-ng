# Tier 2-3 — Provider-matrix and consumer interoperability
#
# Scheduled nightly and dispatchable manually.  Runs the full test matrix
# inside Dockerfile.test using SoftHSM2, NSS softokn, Kryoptic, pkcs11-tool,
# p11tool, and optionally OpenSSL pkcs11-provider.
#
# This job is intentionally NOT a PR gate:
#   - It requires Docker, SoftHSM2, and consumer tool installation.
#   - It takes several minutes to build Kryoptic from source.
#   - Failures here indicate real compatibility regressions and must be
#     investigated, but they should not block unrelated PRs.
#
# Failed runs upload their log artifacts so the full output is inspectable
# without re-running.
#
# Test tiers exercised here:
#   Tier 2: real-module workflow tests (SoftHSM2, NSS, Kryoptic)
#   Tier 3: consumer interoperability (pkcs11-tool, p11tool, OpenSSL pkcs11prov)
#   Tier 4: multi-client, restart, and failure-path tests (#[ignore] suite)
#
# Tier 0 checks are NOT duplicated here — they run on every PR via ci.yml.

name: Nightly provider matrix

on:
  schedule:
    # 03:00 UTC every day
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      skip_consumers:
        description: "Skip consumer interoperability smoke tests"
        required: false
        default: "false"
        type: boolean
      skip_optional_providers:
        description: "Skip NSS and Kryoptic suites (run SoftHSM2 only)"
        required: false
        default: "false"
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  provider-matrix:
    name: Provider matrix (Docker)
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build test image
        run: |
          docker buildx build \
            --file Dockerfile.test \
            --tag pkcs11-proxy-ng-test:ci \
            --load \
            --cache-from type=gha \
            --cache-to   type=gha,mode=max \
            .

      # Dispatch inputs are boolean strings controlled by the workflow operator.
      # They are placed in environment variables and compared in shell — never
      # interpolated directly into a command string.
      - name: Run test matrix inside container
        env:
          SKIP_CONSUMERS: ${{ github.event.inputs.skip_consumers }}
          SKIP_OPTIONAL_PROVIDERS: ${{ github.event.inputs.skip_optional_providers }}
        run: |
          FLAGS="--skip-fast"
          if [[ "${SKIP_CONSUMERS}" == "true" ]]; then
            FLAGS="${FLAGS} --skip-consumers"
          fi
          if [[ "${SKIP_OPTIONAL_PROVIDERS}" == "true" ]]; then
            FLAGS="${FLAGS} --skip-optional-providers"
          fi
          # shellcheck disable=SC2086
          docker run --rm \
            --name pkcs11-proxy-ng-matrix \
            pkcs11-proxy-ng-test:ci \
            bash scripts/test-matrix.sh ${FLAGS} \
            2>&1 | tee matrix-run.log

      - name: Upload matrix log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: matrix-log-${{ github.run_id }}
          path: matrix-run.log
          retention-days: 14

  # ── Tier 0 sanity on the same commit ──────────────────────────────────────
  # Re-run fast checks in the nightly job so nightly also acts as an
  # independent regression signal for unit tests.
  fast-checks:
    name: Tier 0 sanity (nightly)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install protoc (pinned, matches mise.toml)
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          version: 2026.10.3
          install_args: "protoc"

      - name: Install pinned toolchain with components
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.98.1
          components: rustfmt,clippy

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-nightly-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-nightly-

      - name: Install cargo-deny
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install cargo-deny --version 0.20.2 --locked
          fi

      - name: Tier 0 checks
        run: |
          cargo fmt --all -- --check
          cargo deny check
          cargo build --workspace --locked
          cargo test --workspace --locked
          cargo clippy --workspace --locked --all-targets --all-features -- -D warnings

      # W1-L17-15: same standalone-lock coverage as the ci.yml deny job —
      # the root `cargo deny check` above never sees the standalone test
      # workspaces' own locks.
      - name: cargo deny check (standalone test workspaces)
        run: scripts/audit-test-workspaces.sh deny

  # ── Live cross-width topology matrix ─────────────────────────────────────
  # Runs the real-binary width harness (ADR-0011): daemons + SoftHSM2 over
  # localhost TCP. The runner gets both the 64-bit SoftHSM2 package and the
  # extracted i386 library, so all four Linux legs run (32c/64b, 64/64,
  # 64c/32b reverse bridge + D4, 32/32), plus the two NSS32 legs below
  # (64c/32b + 32/32 against i386 softokn). The wine smokes skip cleanly
  # here (no wine image on the runner) and remain host-run scripts.
  cross-width-live:
    name: Live cross-width matrix (SoftHSM2)
    runs-on: ubuntu-26.04
    # W1-L17-22: headroom for the retained-oracle (12 legs, isolated
    # hook-target builds) and SIGTERM drain legs in the live tier.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          # opensc provides pkcs11-tool for the SIGTERM drain leg.
          sudo apt-get install -y softhsm2 opensc \
            gcc-multilib libc6-dev-i386 libnss3-tools
          # The i386 SoftHSM2 library conflicts with the amd64 package on
          # the compat symlink; extract it beside the system instead.
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          # On Ubuntu 26.04, libssl supplies libcrypto and its provider
          # modules, plus the compression runtimes its closure links
          # (2026-10-06 nightly failed ldd with libz.so.1 and
          # libzstd.so.1 not found). The installed multilib packages
          # provide the libc closure.
          apt-get download \
            libsofthsm2:i386 libssl3t64:i386 zlib1g:i386 libzstd1:i386
          sudo mkdir -p /opt/softhsm2-i386
          sudo dpkg -x libsofthsm2_*i386.deb /opt/softhsm2-i386/
          sudo dpkg -x libssl3t64_*i386.deb /opt/softhsm2-i386/
          sudo dpkg -x zlib1g_*i386.deb /opt/softhsm2-i386/
          sudo dpkg -x libzstd1_*i386.deb /opt/softhsm2-i386/
          # Second 32-bit provider leg (NSS i386): libsoftokn3 needs its
          # i386 closure (libnspr4 for libnspr4/libplc4/libplds4,
          # libsqlite3-0 for libsqlite3) extracted beside it, and the
          # NSS32 script builds its fixture DB with certutil (above).
          apt-get download libnss3:i386 libnspr4:i386 libsqlite3-0:i386
          sudo mkdir -p /opt/nss32-i386
          sudo dpkg -x libnss3_*i386.deb /opt/nss32-i386/
          sudo dpkg -x libnspr4_*i386.deb /opt/nss32-i386/
          sudo dpkg -x libsqlite3-0_*i386.deb /opt/nss32-i386/

      - name: Install protoc (pinned, matches mise.toml)
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          version: 2026.10.3
          install_args: "protoc"

      - name: Install pinned toolchain with i686 target
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.98.1
          targets: i686-unknown-linux-gnu

      # The shim joins the daemon: the SIGTERM drain leg drives
      # keygen through the release shim (W1-L17-22).
      - name: Build release daemon and shim
        run: cargo build --locked --release -p pkcs11-proxy-ng -p pkcs11-proxy-ng-shim

      - name: Run live tier
        run: scripts/run-test-tiers.sh live

  # ── Coverage report ───────────────────────────────────────────────────────
  # Ratchet: fails when workspace line coverage drops below 84%. Baseline was
  # 85.20% lines on 2026-09-28; bump the floor (never lower it) once a higher
  # level holds across several nightlies. The lcov + summary stay uploaded so
  # drift is visible run to run.
  coverage:
    name: Coverage (cargo-llvm-cov)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install protoc (pinned, matches mise.toml)
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          version: 2026.10.3
          install_args: "protoc"

      - name: Install pinned toolchain with llvm-tools
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.98.1
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@24b35e792c4eb272ee06051198c72db034fd0be3 # cargo-llvm-cov

      - name: cargo llvm-cov (workspace)
        run: |
          cargo llvm-cov --locked --workspace --lcov --output-path lcov.info \
            --fail-under-lines 84
          cargo llvm-cov report --locked --summary-only | tee coverage-summary.txt

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: |
            lcov.info
            coverage-summary.txt

  # ── Miri legs (undefined-behavior interpreter) ─────────────────────────────
  # Split 2026-10-06 (was one 45-min job): three independent legs run the
  # pure width/translation logic, the shim's unsafe parse paths
  # (mechanism/message param readers, template input parsing), and the
  # backend lifecycle/registry/mock suites under Miri, so one leg's
  # slowness can't mask the others' signals (the types leg stalled the
  # whole job on 2026-10-06). Tests that need real time/FFI are already
  # `cfg_attr(miri, ignore)`d. Each leg repeats the same setup.
  miri-types:
    name: Miri types (width/attribute/logic)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install protoc (pinned, matches mise.toml)
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          version: 2026.10.3
          install_args: "protoc"

      - name: Install nightly toolchain with miri
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: nightly
          components: miri

      # Scope notes (measured 2026-07-04, expanded 2026-09-28, resharded
      # 2026-09-30, split 2026-10-06): the types suite runs
      # all-but-TOML under Miri (was 114 tests in ~31 s on 2026-09-30).
      # Skipped: `mechanism_registry::tests` (pervasive TOML parsing is
      # too slow under the interpreter; covered by fuzz_registry plus
      # the native registry tests instead — Kani registry-query proofs
      # were attempted and removed as CBMC-intractable, see
      # kani_proofs.rs) and `mechanism_param_manifest::manifest_tests`
      # (the 41 KB manifest TOML parse stalls under Miri — a parse-only
      # test exceeded 600 s locally on 2026-10-06 while the module runs
      # in 0.02 s natively; same pathology as the registry skip, and
      # these are source-text audit tests with zero unsafe and no UB
      # surface, still gated natively). Nine registry-loading
      # shape_descriptors tests carry per-test `cfg_attr(miri, ignore)`
      # (same message as the shim precedent; every uncached load costs
      # ~50 s under Miri). The `--skip` form auto-includes future pure
      # types modules — a new TOML-loading test must take the same
      # ignore, else this leg stalls again. Deliberately NOT gated: the
      # two TOML suites above; the server crate's `consistency_checks` is out of
      # this job's scope (pure safe string audits, zero unsafe, no UB
      # surface — assessed 2026-09-30). --test-threads=1 serializes the
      # interpreter (faster than Miri-threaded, and hangs stay
      # attributable to one test).
      - name: cargo miri test (types)
        run: |
          cargo +nightly miri test --locked -p pkcs11-proxy-ng-types --lib -- --skip mechanism_registry --skip mechanism_param_manifest --test-threads=1

  miri-shim:
    name: Miri shim parse paths
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install protoc (pinned, matches mise.toml)
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          version: 2026.10.3
          install_args: "protoc"

      - name: Install nightly toolchain with miri
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: nightly
          components: miri

      # On the shim, daemon-based tests:: modules self-gate with
      # #[cfg(not(miri))] in tests/mod.rs (measured 2026-09-30:
      # 130 passed, 5 ignored in ~101 s across width_bridge,
      # nested_template_input_tests, not_wild_read plus the 8 tests::
      # modules abi_audit, null_pointers, attribute_classification,
      # dispatch_shape, endpoint, regression, resource_limits,
      # poison_recovery — poison fixtures use same-thread catch_unwind;
      # the two TOML-loading registry tests stay native-only). The
      # raw-pointer parse paths below are the point.
      - name: cargo miri test (shim parse paths)
        run: |
          cargo +nightly miri test --locked -p pkcs11-proxy-ng-shim --lib -- \
            dispatch::general::width_bridge \
            template_input::nested_template_input_tests \
            not_wild_read \
            tests::abi_audit \
            tests::null_pointers \
            tests::attribute_classification \
            tests::dispatch_shape \
            tests::endpoint \
            tests::regression \
            tests::resource_limits \
            tests::poison_recovery \
            exact_attribute_error
          # Shim param-reader suites run as SEPARATE lines (measured
          # 2026-09-30): each passes standalone (56 in ~92 s, 36 in
          # ~12 s, 15 in ~9 s) but the combined 107-test process
          # stalls (~48 done at the 500 s cap) — same Miri-harness
          # interaction shape as mock:: (no UB signal; root cause not
          # isolated). These cover the unsafe mechanism/message param
          # readers the scope comment names.
          cargo +nightly miri test --locked -p pkcs11-proxy-ng-shim --lib -- \
            dispatch::general::helpers::mechanism_parameter_tests --test-threads=1
          cargo +nightly miri test --locked -p pkcs11-proxy-ng-shim --lib -- \
            dispatch::general::helpers::message_parameter_tests --test-threads=1
          cargo +nightly miri test --locked -p pkcs11-proxy-ng-shim --lib -- \
            dispatch::general::helpers::mechanism_writeback_tests --test-threads=1

  miri-backend:
    name: Miri backend (lifecycle/registry/mock)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install protoc (pinned, matches mise.toml)
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          version: 2026.10.3
          install_args: "protoc"

      - name: Install nightly toolchain with miri
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: nightly
          components: miri

      # The backend leg covers the Miri-designed lifecycle/registry
      # state-machine suites (measured 2026-09-29: 40 tests in ~18 s);
      # dlopen-dependent tests self-skip under Miri via cfg!(miri)
      # early returns.
      # The mock:: suite is gated PER FILE (measured 2026-09-30): the
      # one-line `mock::` form times out (20 min, died in workflows after
      # 159 tests) and profiles+workflows in one process stalls on the
      # vendor-override test (500 s cap) although every file passes in
      # isolation and rest+workflows passes combined (129 s) — a
      # Miri-harness interaction with no UB signal (zero `unsafe` in
      # mock/; root cause not isolated). Five registry/official-list
      # matrix tests are cfg_attr(miri, ignore)d with measured notes
      # (each 240-900 s standalone). All mock lines use
      # --test-threads=1. Measured: 187 passed, 5 ignored, ~250 s
      # interpretation total.
      - name: cargo miri test (backend)
        run: |
          cargo +nightly miri test --locked -p pkcs11-proxy-ng-backend --lib -- \
            ffi::native_domain_tests \
            ffi::native_domain::tests \
            mock::echo
          # Tree Borrows for the FFI materializers: their Pin-stabilized
          # capture-then-move idiom is sound (pinned contents never move)
          # but Stacked Borrows rejects it. Tree Borrows still caught a
          # real pParameter misalignment here (MacGeneral/Extract/
          # ObjectHandle now use typed NativeAllocation; attribute Ulongs
          # and X3DH handle buffers followed in review follow-up).
          # Measured 2026-09-30: 86 tests in ~25 s.
          MIRIFLAGS="-Zmiri-tree-borrows" \
          cargo +nightly miri test --locked -p pkcs11-proxy-ng-backend --lib -- \
            ffi::ffi_conversion
          # mock:: per-file gate (see scope note; mock::echo stays on the
          # native-domain line above). Each line proven green standalone.
          cargo +nightly miri test --locked -p pkcs11-proxy-ng-backend --lib -- \
            mock::tests::derive --test-threads=1
          cargo +nightly miri test --locked -p pkcs11-proxy-ng-backend --lib -- \
            mock::tests::exact_outputs --test-threads=1
          cargo +nightly miri test --locked -p pkcs11-proxy-ng-backend --lib -- \
            mock::tests::find_swap --test-threads=1
          cargo +nightly miri test --locked -p pkcs11-proxy-ng-backend --lib -- \
            mock::tests::profiles --test-threads=1
          cargo +nightly miri test --locked -p pkcs11-proxy-ng-backend --lib -- \
            mock::tests::rest mock::tests::workflows --test-threads=1
          cargo +nightly miri test --locked -p pkcs11-proxy-ng-backend --lib -- \
            mock::tests::session_state --test-threads=1
          cargo +nightly miri test --locked -p pkcs11-proxy-ng-backend --lib -- \
            mock::mock_types mock::output_lengths --test-threads=1
          # Backend pure-logic FFI suites (measured 2026-09-30, each green
          # standalone, ~35 s total): mapping (7), native_allocation (4),
          # lifecycle_domain_tests (34), call_helpers (13), session_fence
          # (11), retained_owner_contract_tests (9+2 ignored; the
          # dlopen-needing oracle_retains_init_root... test is skipped).
          # Deliberately NOT gated: wrap/contract, exact_output_contract,
          # native_stop, interface_caps, constructor_child, crypto_ops,
          # message_ops, session_ops, kem_ops, object_ops,
          # verify_signature_ops, session_3x_ops, key_state_ops, loading —
          # every test builds a full FfiBackend whose `_lib` needs
          # dlopen(NULL) (loading::test_library_handle) or the tests need
          # readlink/statx/child processes; Miri rejects all foreign calls
          # (measured: 0 UB, only unsupported-operation aborts). A
          # null-handle Miri arm cannot work either: backend Drop would
          # still call foreign dlclose. Native + docker matrix cover them.
          cargo +nightly miri test --locked -p pkcs11-proxy-ng-backend --lib -- \
            ffi::mapping --test-threads=1
          cargo +nightly miri test --locked -p pkcs11-proxy-ng-backend --lib -- \
            ffi::native_allocation --test-threads=1
          cargo +nightly miri test --locked -p pkcs11-proxy-ng-backend --lib -- \
            ffi::lifecycle_domain_tests --test-threads=1
          cargo +nightly miri test --locked -p pkcs11-proxy-ng-backend --lib -- \
            ffi::call_helpers --test-threads=1
          cargo +nightly miri test --locked -p pkcs11-proxy-ng-backend --lib -- \
            ffi::session_fence --test-threads=1
          cargo +nightly miri test --locked -p pkcs11-proxy-ng-backend --lib -- \
            ffi::retained_owner_contract_tests \
            --skip oracle_retains_init_root_across_native_calls --test-threads=1

  # ── Fuzz smoke (cargo-fuzz, libFuzzer) ────────────────────────────────────
  # Short time-boxed smoke over the five harnesses in fuzz/fuzz_targets:
  # width translation, registry TOML, attribute proto edge, mechanism
  # wire edge, and the pre-decode wire scanner. Any crash fails the job
  # and uploads the artifact for triage. Longer campaigns run on demand
  # locally (see doc/development.md).
  fuzz-smoke:
    name: Fuzz smoke (5 targets x 90 s)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install protoc (pinned, matches mise.toml)
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          version: 2026.10.3
          install_args: "protoc"

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: cargo fuzz build
        run: cargo +nightly fuzz build

      - name: Seed corpora from checked-in seeds
        run: |
          for target in fuzz_width fuzz_registry fuzz_attribute fuzz_protected_decode fuzz_mechanism; do
            mkdir -p "fuzz/corpus/$target"
            cp fuzz/seeds/$target/* "fuzz/corpus/$target/"
          done

      - name: Fuzz smoke (90 s per target)
        run: |
          for target in fuzz_width fuzz_registry fuzz_attribute fuzz_protected_decode fuzz_mechanism; do
            dict=""
            case "$target" in
              fuzz_registry) dict="-dict=fuzz/dict/registry.dict" ;;
              fuzz_attribute) dict="-dict=fuzz/dict/attribute.dict" ;;
              fuzz_protected_decode) dict="-dict=fuzz/dict/rpc_paths.dict" ;;
            esac
            # shellcheck disable=SC2086
            cargo +nightly fuzz run "$target" -- -max_total_time=90 -print_final_stats=1 $dict
          done

      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/

  # ── Kani proofs (pure types laws) ────────────────────────────────────────────
  # `crates/types/src/kani_proofs.rs` proves 31 harnesses (unit +
  # randomized law tests cover examples; each harness covers its modeled,
  # bounded inputs exhaustively — see kani_proofs.rs header): width
  # "never silently truncate" laws, attribute-classifier laws,
  # mechanism/object/session/slot/secret/output laws, CkRv laws,
  # CkInBuf pointer laws, and the official-mechanism table law. The
  # module is `#[cfg(kani)]`-gated with no manifest
  # dependency — `cargo kani` injects its library — so stable/MSRV builds
  # are unaffected. Pinned verifier; bump only after re-running locally.
  kani:
    name: Kani types proofs (31 harnesses)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.98.1

      - name: Install Kani verifier (pinned)
        run: cargo install kani-verifier --locked --version 0.68.0

      - name: Kani first-time setup (toolchain + CBMC)
        run: cargo kani setup

      - name: Verify width proofs
        run: cargo kani -p pkcs11-proxy-ng-types --output-format terse
