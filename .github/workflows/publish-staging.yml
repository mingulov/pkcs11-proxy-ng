# Staging publication workflow (manual, main-only, upload-free by default).
#
# Ordinary `publish.yml` dry-runs stay upload-free; this workflow is the
# only path that uploads anything before production, and it targets a
# separate staging account/endpoint — never crates.io. It runs only by
# manual dispatch on `main` under the protected `crates-io-staging`
# environment (required reviewers), and uploads only the generated
# dependency-free probe crate `pkcs11-proxy-ng-publish-probe`.
#
# The `probe` job generates the probe and records its identity; the
# `staging-upload` job repeats the source/ref/probe checks, refuses unless
# the protected environment provides the staging endpoint binding
# (`STAGING_OIDC_URL`) and upload credential
# (`CARGO_REGISTRIES_STAGING_TOKEN`), dry-runs the staging publish first
# (proving the endpoint resolves without uploading), then performs the
# real staging upload and retains signed staging evidence. The production
# registry, bootstrap token, and OIDC trusted-publishing action never
# appear here.

name: publish-staging

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  probe:
    name: Generate dependency-free staging probe
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    outputs:
      probe_version: ${{ steps.generate.outputs.probe_version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
          fetch-depth: 1

      - name: Install Python for release checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      # No toolchain/protoc/Cargo setup here: probe generation is pure
      # Python (staging-probe CLI); cargo runs only in staging-upload.
      - name: Generate staging probe
        id: generate
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 scripts/release_checks.py staging-probe \
            --destination probe --run-id "$RUN_ID" --attempt "$RUN_ATTEMPT"
          PROBE_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("probe/Cargo.toml", "rb"))["package"]["version"])')"
          echo "probe_version=${PROBE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload staging probe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: probe/
          overwrite: false
          retention-days: 90
          if-no-files-found: error

  staging-upload:
    name: Upload probe to staging registry
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: [probe]
    if: github.ref == 'refs/heads/main'
    environment: crates-io-staging
    env:
      STAGING_OIDC_URL: ${{ vars.STAGING_OIDC_URL }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
          fetch-depth: 1

      - name: Install Python for release checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install pinned Cargo for staging upload
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.98.1

      - name: Install protoc (pinned, matches mise.toml)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "36.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Isolate Cargo build and target directories
        run: |
          set -euo pipefail
          echo "CARGO_BUILD_BUILD_DIR=$RUNNER_TEMP/staging-upload/build" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/staging-upload/target" >> "$GITHUB_ENV"

      - name: Download staging probe
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: staging-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: probe/

      # Source/ref/probe rechecks plus endpoint binding: the protected
      # environment owns the staging endpoint, so the run refuses unless
      # the binding is present, then binds the recorded evidence to it.
      - name: Recheck source, probe, and staging endpoint
        run: |
          set -euo pipefail
          git fetch --no-tags --depth 1 origin main:refs/remotes/origin/main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse refs/remotes/origin/main)" ]]; then
            echo "::error::staging upload requires a main checkout; refusing."
            exit 1
          fi
          python3 - <<'EOF'
          import sys, tomllib
          manifest = tomllib.load(open("probe/Cargo.toml", "rb"))
          package = manifest["package"]
          assert package["name"] == "pkcs11-proxy-ng-publish-probe", package["name"]
          assert package["publish"] == ["staging"], package["publish"]
          assert "dependencies" not in manifest, "probe must be dependency-free"
          assert manifest.get("workspace") == {}, "probe must leave the workspace"
          EOF
          if [[ -z "${STAGING_OIDC_URL:-}" ]]; then
            echo "::error::protected staging environment provides no STAGING_OIDC_URL; refusing."
            exit 1
          fi
          if [[ "$STAGING_OIDC_URL" != https://* || "$STAGING_OIDC_URL" == *@* ]]; then
            echo "::error::STAGING_OIDC_URL must be credential-free https; refusing."
            exit 1
          fi

      - name: Dry-run staging publish (endpoint validation)
        env:
          CARGO_REGISTRIES_STAGING_TOKEN: ${{ secrets.CARGO_REGISTRIES_STAGING_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRIES_STAGING_TOKEN:-}" ]]; then
            echo "::error::protected staging environment provides no CARGO_REGISTRIES_STAGING_TOKEN; refusing."
            exit 1
          fi
          cd probe
          cargo publish --dry-run --locked --registry staging

      - name: Publish probe to staging registry
        env:
          CARGO_REGISTRIES_STAGING_TOKEN: ${{ secrets.CARGO_REGISTRIES_STAGING_TOKEN }}
        run: |
          set -euo pipefail
          cd probe
          cargo publish --locked --registry staging
          cd ..
          PROBE_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("probe/Cargo.toml", "rb"))["package"]["version"])')"
          python3 - "$PROBE_VERSION" <<'EOF' > staging-evidence.json
          import json, os, sys
          from datetime import datetime, timezone
          print(json.dumps({"probe": "pkcs11-proxy-ng-publish-probe",
                            "version": sys.argv[1],
                            "endpoint_binding": os.environ["STAGING_OIDC_URL"],
                            "published_at": datetime.now(timezone.utc).isoformat()},
                           indent=2, sort_keys=True))
          EOF

      - name: Retain staging evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            probe/
            staging-evidence.json
          overwrite: false
          retention-days: 90
          if-no-files-found: error
