# Registry-source GitHub release workflow.
#
# Builds release binaries ONLY from exact already-published crates.io
# source archives (plus their original packaged locks) — never from
# checkout source. There is no tag-push trigger: this workflow runs as a
# reusable callee (`workflow_call`, auto-called by `publish.yml` only after
# explicit all-eight complete success) or as an exact-tag manual retry
# (`workflow_dispatch` with `candidate_run_id`); the manual path never
# republishes crates.
#
# Recovery contract: the `recover` job validates the referenced publish
# run (same repository, `.github/workflows/publish.yml` workflow path,
# manual event, tag-peeled head SHA) and requires exactly one matching
# unexpired `crates-candidate-<tagCommit>-<runId>` artifact via read-only
# `actions: read`. Missing/expired/ambiguous evidence refuses; expected
# hashes are never reconstructed from already-published registry data.
# `recover` then rechecks source/tag/receipt/qualification/candidate
# binding (including exact annotated tag object plus peeled commit) before
# `registry-recheck` re-verifies all eight published checksums and full
# registry consumers.
#
# Binary jobs carry no registry token and no OIDC permission. `publish`
# runs under the protected `release` environment and is the only job with
# the write permission the GitHub Release needs (the reusable caller must
# delegate that permission; every other job stays read-only).
# Assets publish through one combined path: existing same-named assets are
# compared first — identical bytes are retained, missing assets are added,
# divergent bytes refuse. Tags are never moved; assets are never silently
# replaced or deleted; a retry where everything already matches uploads
# nothing. Repository prerequisite: create the `release` environment with
# required reviewers and tag deployment restrictions.

name: release

on:
  workflow_call:
    inputs:
      tag:
        description: 'exact stable tag, e.g. vX.Y.Z'
        required: true
        type: string
      candidate_run_id:
        description: 'publish run holding the pre-auth candidate'
        required: true
        type: string
      qualification-url:
        description: 'HTTPS qualification record URL'
        required: true
        type: string
      qualification-subject:
        description: 'frozen-subject SHA'
        required: true
        type: string
      qualification-run-id:
        description: 'qualification evidence run id'
        required: true
        type: string
      qualification-framework:
        description: 'qualification framework commit SHA'
        required: true
        type: string
      qualification-record-sha256:
        description: 'provider-selection record digest'
        required: true
        type: string
      qualification-receipt-sha256:
        description: 'qualification receipt digest'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'exact stable tag, e.g. vX.Y.Z'
        required: true
      candidate_run_id:
        description: 'publish run holding the pre-auth candidate'
        required: true
      qualification-url:
        description: 'HTTPS qualification record URL'
        required: true
      qualification-subject:
        description: 'frozen-subject SHA'
        required: true
      qualification-run-id:
        description: 'qualification evidence run id'
        required: true
      qualification-framework:
        description: 'qualification framework commit SHA'
        required: true
      qualification-record-sha256:
        description: 'provider-selection record digest'
        required: true
      qualification-receipt-sha256:
        description: 'qualification receipt digest'
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  recover:
    name: Recover and recheck candidate evidence
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.recheck.outputs.tag }}
      tag_commit: ${{ steps.recheck.outputs.tag_commit }}
      tag_date: ${{ steps.recheck.outputs.tag_date }}
    env:
      RECOVER_TAG: ${{ inputs.tag }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      QUALIFICATION_URL: ${{ inputs.qualification-url }}
      QUALIFICATION_SUBJECT: ${{ inputs.qualification-subject }}
      QUALIFICATION_RUN_ID: ${{ inputs.qualification-run-id }}
      QUALIFICATION_FRAMEWORK: ${{ inputs.qualification-framework }}
      QUALIFICATION_RECORD_SHA256: ${{ inputs.qualification-record-sha256 }}
      QUALIFICATION_RECEIPT_SHA256: ${{ inputs.qualification-receipt-sha256 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout tag with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch origin main for ancestry checks
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Install Python for release checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Verify release subject
        run: scripts/verify-release-subject.sh "$RECOVER_TAG"

      - name: Verify quality receipt
        run: scripts/verify-quality-receipt.sh "$RECOVER_TAG"

      # Read-only authorization gate: the live release environment
      # must carry required reviewers plus the documented ref policy
      # before the publish job may upload release assets (see
      # doc/release/environment-protection-contract.md). Fails closed
      # on missing environment, missing reviewers,
      # permissive/mismatched ref policy, or unavailable API.
      - name: Verify release environment protections
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/environments" \
            > "$RUNNER_TEMP/release-env-list.json"
          gh api "repos/${GITHUB_REPOSITORY}/environments/release/deployment-branch-policies" \
            > "$RUNNER_TEMP/release-env-policies.json"
          python3 scripts/release_checks.py environments-preflight \
            --api-json "$RUNNER_TEMP/release-env-list.json" \
            --environment release \
            --policies-json "release=$RUNNER_TEMP/release-env-policies.json"

      # Qualification gate: re-verify the frozen subject's provider
      # evidence from the immutable qualification artifact before any
      # binary job starts (see
      # doc/release/qualification-binding-contract.md). Composes with
      # the environments-preflight step above: authorization and
      # evidence are separate gates; both refuse before the asset
      # upload. Expected tree/lock come from the frozen subject
      # (HEAD~1, the pre-receipt parent), never from the evidence
      # being validated. The validated record, receipt, and complete
      # evidence bundle are staged for durable retention as release
      # assets.
      - name: Reverify provider qualification evidence
        run: |
          set -euo pipefail
          gh run download "$QUALIFICATION_RUN_ID" \
            -n provider-qualification \
            -D "$RUNNER_TEMP/qual-evidence" \
            -R "$GITHUB_REPOSITORY"
          EXPECT_TREE="$(git rev-parse 'HEAD~1^{tree}')"
          EXPECT_LOCK="$(git show 'HEAD~1:Cargo.lock' | sha256sum | cut -d' ' -f1)"
          python3 scripts/release_checks.py qualification-preflight \
            --evidence-dir "$RUNNER_TEMP/qual-evidence" \
            --expect-commit "$QUALIFICATION_SUBJECT" \
            --expect-tree "$EXPECT_TREE" \
            --expect-lock-sha256 "$EXPECT_LOCK" \
            --expect-framework "$QUALIFICATION_FRAMEWORK" \
            --expect-run-id "$QUALIFICATION_RUN_ID" \
            --expect-url "$QUALIFICATION_URL" \
            --expect-record-sha256 "$QUALIFICATION_RECORD_SHA256" \
            --expect-receipt-sha256 "$QUALIFICATION_RECEIPT_SHA256"

      - name: Reinspect tag, source, and qualification binding
        id: recheck
        run: |
          set -euo pipefail
          TAG="${RECOVER_TAG#refs/tags/}"
          python3 scripts/release_checks.py tag-evidence --tag "$TAG" --repo .
          PEELED="$(git rev-parse "${TAG}^{}")"
          python3 scripts/release_checks.py preflight --ref "refs/tags/${TAG}" \
            --require-main --mode dry-run --package workspace \
            --qualification-url "$QUALIFICATION_URL" \
            --qualification-subject "$QUALIFICATION_SUBJECT"
          {
            echo "tag=${TAG}"
            echo "tag_commit=${PEELED}"
            echo "tag_date=$(git log -1 --format=%ct "$TAG")"
          } >> "$GITHUB_OUTPUT"

      - name: Collect candidate run evidence
        run: |
          set -euo pipefail
          # The run's own head feeds --head-sha below: pre-fix tag
          # scripts require the flag (tautology for them), new scripts
          # ignore it. Tag binding comes from the artifact name plus
          # evidence-verify below, never from the dispatch head.
          RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" \
            --jq '{id: .id, event: .event, head_sha: .head_sha, path: .path}')"
          ART_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/artifacts" \
            --jq '[.artifacts[] | {name: .name, expired: .expired, expires_at: .expires_at}]')"
          jq -n --argjson run "$RUN_JSON" --argjson arts "$ART_JSON" \
            --arg repo "$GITHUB_REPOSITORY" \
            '{runs: [$run + {repository: $repo, workflow_path: $run.path, artifacts: $arts}]}' \
            > runs.json

      - name: Select exact candidate evidence
        id: select
        env:
          EXPECT_WORKFLOW: .github/workflows/publish.yml
          EXPECT_EVENT: workflow_dispatch
          TAG_COMMIT: ${{ steps.recheck.outputs.tag_commit }}
        run: |
          set -euo pipefail
          ARTIFACT="$(python3 scripts/release_checks.py candidate-name \
            --tag-commit "$TAG_COMMIT" --run-id "$CANDIDATE_RUN_ID")"
          RUN_HEAD="$(jq -r '.runs[0].head_sha' runs.json)"
          python3 scripts/release_checks.py evidence-select \
            --runs-json runs.json --run-id "$CANDIDATE_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" --workflow "$EXPECT_WORKFLOW" \
            --event "$EXPECT_EVENT" --head-sha "$RUN_HEAD" --name "$ARTIFACT"
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"

      - name: Download immutable pre-auth candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.select.outputs.artifact }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: recovered/

      - name: Verify recovered qualification binding
        env:
          TAG_COMMIT: ${{ steps.recheck.outputs.tag_commit }}
        run: |
          set -euo pipefail
          python3 scripts/release_checks.py evidence-verify \
            --binding recovered/qualification-binding.json \
            --expect-url "$QUALIFICATION_URL" \
            --expect-subject "$QUALIFICATION_SUBJECT" \
            --expect-tag-commit "$TAG_COMMIT" \
            --expect-run-id "$CANDIDATE_RUN_ID" \
            --expect-receipt-sha256 "$QUALIFICATION_RECEIPT_SHA256" \
            --expect-record-sha256 "$QUALIFICATION_RECORD_SHA256" \
            --expect-qual-run-id "$QUALIFICATION_RUN_ID" \
            --expect-framework "$QUALIFICATION_FRAMEWORK"

      - name: Stage validated qualification record for retention
        run: |
          set -euo pipefail
          # The gate above verified these exact bytes against the
          # pinned digests; copy (never re-download) them into the
          # recovered evidence so the publish job retains them as
          # durable release assets alongside provenance. The archive
          # preserves the receipt/bundle relative layout so the
          # portable validator can revalidate after run expiry.
          cp "$RUNNER_TEMP/qual-evidence/bundle/pool-evidence.json" \
            recovered/qualification-record.json
          cp "$RUNNER_TEMP/qual-evidence/receipt.json" \
            recovered/qualification-receipt.json
          tar -czf recovered/qualification-evidence.tar.gz \
            -C "$RUNNER_TEMP/qual-evidence" receipt.json bundle

      - name: Stage recovered evidence for downstream jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-${{ github.run_id }}
          path: recovered/
          overwrite: false
          retention-days: 90
          if-no-files-found: error

  registry-recheck:
    name: Recheck registry before binaries
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    needs: [recover]
    steps:
      # The tag tree: the registry consumer pins externals to the
      # checkout's Cargo.lock, which must be the release's lock.
      - name: Checkout tag tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      # R10 (S2 §11): the test-only v1-enable cfg must never reach packaged
      # artifacts. Fail loudly if RUSTFLAGS carries it.
      - name: Reject test-only mechanism-params cfg
        run: |
          set -euo pipefail
          if [[ "${RUSTFLAGS:-}" == *"pkcs11_proxy_test_mechanism_params_v1"* ]]; then
            echo "::error::RUSTFLAGS carries the test-only cfg pkcs11_proxy_test_mechanism_params_v1; refusing."
            exit 1
          fi

      - name: Install Python for release checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install MSRV toolchain for registry consumers
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.88.0

      - name: Install protoc (pinned, matches mise.toml)
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          install_args: "protoc"

      - name: Isolate Cargo build and target directories
        run: |
          set -euo pipefail
          echo "CARGO_BUILD_BUILD_DIR=$RUNNER_TEMP/release-recheck/build" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/release-recheck/target" >> "$GITHUB_ENV"

      - name: Download recovered candidate evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evidence-${{ github.run_id }}
          path: recovered/

      - name: Verify all eight published checksums
        run: |
          set -euo pipefail
          python3 scripts/release_checks.py registry-verify \
            --inventory recovered/inventory.json

      - name: Run full registry consumers
        run: |
          set -euo pipefail
          python3 scripts/release_checks.py registry-consumer \
            --inventory recovered/inventory.json

  binary-linux:
    name: Registry-source Linux bundle
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    needs: [recover, registry-recheck]
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      TAG_DATE: ${{ needs.recover.outputs.tag_date }}
    outputs:
      bundle: ${{ steps.stage.outputs.bundle }}
    steps:
      - name: Checkout tag tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      # R10 (S2 §11): the test-only v1-enable cfg must never reach packaged
      # artifacts. Fail loudly if RUSTFLAGS carries it.
      - name: Reject test-only mechanism-params cfg
        run: |
          set -euo pipefail
          if [[ "${RUSTFLAGS:-}" == *"pkcs11_proxy_test_mechanism_params_v1"* ]]; then
            echo "::error::RUSTFLAGS carries the test-only cfg pkcs11_proxy_test_mechanism_params_v1; refusing."
            exit 1
          fi

      - name: Isolate Cargo build and target directories
        run: |
          set -euo pipefail
          echo "CARGO_BUILD_BUILD_DIR=$RUNNER_TEMP/release-linux/build" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/release-linux/target" >> "$GITHUB_ENV"

      - name: Install protoc (pinned, matches mise.toml)
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          install_args: "protoc"

      - name: Install pinned release toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Download recovered candidate evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/release-linux/candidate

      # Registry mode builds from exact published crates.io archives plus
      # their original packaged locks; checkout source is never an input.
      - name: Registry-mode binary build (Linux GNU)
        run: |
          set -euo pipefail
          python3 scripts/release_checks.py binary-build \
            --source registry --target x86_64-unknown-linux-gnu \
            --inventory "${{ runner.temp }}/release-linux/candidate/inventory.json" \
            --package-dir "${{ runner.temp }}/release-linux/candidate" \
            --output "${{ runner.temp }}/release-linux/output" \
            --toolchain 1.98.1

      # Same-tag retries of older tags (e.g. v0.2.0) execute that
      # tag's producer, which records only the candidate dir as
      # package_dir; only those legacy inputs need the pin to the
      # true home. Current scripts record archives_dir themselves
      # and pass through untouched. Names and sha256 stay pinned
      # against the inventory downstream either way.
      - name: Pin legacy inputs to verified registry archives
        run: |
          set -euo pipefail
          OUT="${{ runner.temp }}/release-linux/output"
          if jq -e '.archives_dir' "$OUT/build-inputs.json" > /dev/null; then
            echo "build inputs record archives_dir; no pin needed"
          else
            jq --arg home "$OUT/verified-archives" '.package_dir = $home' \
              "$OUT/build-inputs.json" > "$OUT/build-inputs.pinned.json"
            mv "$OUT/build-inputs.pinned.json" "$OUT/build-inputs.json"
          fi

      - name: Notices + bundle
        id: stage
        run: |
          set -euo pipefail
          OUT="${{ runner.temp }}/release-linux/output"
          python3 scripts/release_checks.py notices --build-inputs "$OUT/build-inputs.json" --output "$OUT/notices"
          python3 scripts/release_checks.py bundle --binaries "$OUT/binaries" --provenance "$OUT/build-provenance.json" --notices "$OUT/notices" --output "$OUT/staged-bundle" --timestamp "$TAG_DATE" --inventory "${{ runner.temp }}/release-linux/candidate/inventory.json" --package-dir "${{ runner.temp }}/release-linux/candidate"
          ARCHIVES=( "$OUT/staged-bundle"/*.tar.gz )
          if [ "${#ARCHIVES[@]}" -ne 1 ]; then
            echo "::error::expected exactly one Linux bundle tarball"
            exit 1
          fi
          echo "bundle=$(basename "${ARCHIVES[0]}")" >> "$GITHUB_OUTPUT"

      - name: Upload Linux bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-bundle-${{ inputs.tag }}
          path: ${{ runner.temp }}/release-linux/output/staged-bundle/
          if-no-files-found: error
          retention-days: 90

  binary-windows:
    name: Registry-source Windows bundle
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    needs: [recover, registry-recheck]
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      TAG_DATE: ${{ needs.recover.outputs.tag_date }}
    outputs:
      bundle: ${{ steps.stage.outputs.bundle }}
    steps:
      - name: Checkout tag tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      # R10 (S2 §11): the test-only v1-enable cfg must never reach packaged
      # artifacts. Fail loudly if RUSTFLAGS carries it.
      - name: Reject test-only mechanism-params cfg
        run: |
          set -euo pipefail
          if [[ "${RUSTFLAGS:-}" == *"pkcs11_proxy_test_mechanism_params_v1"* ]]; then
            echo "::error::RUSTFLAGS carries the test-only cfg pkcs11_proxy_test_mechanism_params_v1; refusing."
            exit 1
          fi

      - name: Isolate Cargo build and target directories
        run: |
          set -euo pipefail
          echo "CARGO_BUILD_BUILD_DIR=$RUNNER_TEMP/release-windows/build" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/release-windows/target" >> "$GITHUB_ENV"

      - name: Install LLVM (clang/lld/llvm-lib) + nasm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld llvm nasm

      - name: Install protoc (pinned, matches mise.toml)
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          install_args: "protoc"

      - name: Install pinned toolchain with Windows MSVC target
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-xwin
        run: cargo install cargo-xwin --version 0.23.1 --locked

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Download recovered candidate evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/release-windows/candidate

      # Registry mode builds from exact published crates.io archives plus
      # their original packaged locks; checkout source is never an input.
      - name: Registry-mode binary build (Windows MSVC)
        run: |
          set -euo pipefail
          python3 scripts/release_checks.py binary-build --source registry --target x86_64-pc-windows-msvc \
            --inventory "${{ runner.temp }}/release-windows/candidate/inventory.json" \
            --package-dir "${{ runner.temp }}/release-windows/candidate" \
            --output "${{ runner.temp }}/release-windows/output" \
            --toolchain 1.98.1

      # Same-tag retries of older tags (e.g. v0.2.0) execute that
      # tag's producer, which records only the candidate dir as
      # package_dir; only those legacy inputs need the pin to the
      # true home. Current scripts record archives_dir themselves
      # and pass through untouched. Names and sha256 stay pinned
      # against the inventory downstream either way.
      - name: Pin legacy inputs to verified registry archives
        run: |
          set -euo pipefail
          OUT="${{ runner.temp }}/release-windows/output"
          if jq -e '.archives_dir' "$OUT/build-inputs.json" > /dev/null; then
            echo "build inputs record archives_dir; no pin needed"
          else
            jq --arg home "$OUT/verified-archives" '.package_dir = $home' \
              "$OUT/build-inputs.json" > "$OUT/build-inputs.pinned.json"
            mv "$OUT/build-inputs.pinned.json" "$OUT/build-inputs.json"
          fi

      - name: Notices + bundle
        id: stage
        run: |
          set -euo pipefail
          OUT="${{ runner.temp }}/release-windows/output"
          python3 scripts/release_checks.py notices --build-inputs "$OUT/build-inputs.json" --output "$OUT/notices"
          python3 scripts/release_checks.py bundle --binaries "$OUT/binaries" --provenance "$OUT/build-provenance.json" --notices "$OUT/notices" --output "$OUT/staged-bundle" --timestamp "$TAG_DATE" --inventory "${{ runner.temp }}/release-windows/candidate/inventory.json" --package-dir "${{ runner.temp }}/release-windows/candidate"
          ARCHIVES=( "$OUT/staged-bundle"/*.zip )
          if [ "${#ARCHIVES[@]}" -ne 1 ]; then
            echo "::error::expected exactly one Windows bundle ZIP"
            exit 1
          fi
          echo "bundle=$(basename "${ARCHIVES[0]}")" >> "$GITHUB_OUTPUT"

      - name: Upload Windows bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-bundle-${{ inputs.tag }}
          path: ${{ runner.temp }}/release-windows/output/staged-bundle/
          if-no-files-found: error
          retention-days: 90

  binary-macos:
    name: Registry-source macOS bundle
    runs-on: macos-15
    timeout-minutes: 120
    needs: [recover, registry-recheck]
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      TAG_DATE: ${{ needs.recover.outputs.tag_date }}
    outputs:
      bundle: ${{ steps.stage.outputs.bundle }}
    steps:
      - name: Checkout tag tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      # R10 (S2 §11): the test-only v1-enable cfg must never reach packaged
      # artifacts. Fail loudly if RUSTFLAGS carries it.
      - name: Reject test-only mechanism-params cfg
        run: |
          set -euo pipefail
          if [[ "${RUSTFLAGS:-}" == *"pkcs11_proxy_test_mechanism_params_v1"* ]]; then
            echo "::error::RUSTFLAGS carries the test-only cfg pkcs11_proxy_test_mechanism_params_v1; refusing."
            exit 1
          fi

      - name: Isolate Cargo build and target directories
        run: |
          set -euo pipefail
          echo "CARGO_BUILD_BUILD_DIR=$RUNNER_TEMP/release-macos/build" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/release-macos/target" >> "$GITHUB_ENV"

      - name: Install protoc (pinned, matches mise.toml)
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          install_args: "protoc"

      - name: Install pinned release toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Download recovered candidate evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/release-macos/candidate

      # Registry mode builds from exact published crates.io archives plus
      # their original packaged locks; checkout source is never an input.
      # Native arm64 build: the script executes --version and loads the
      # shim, so the binaries are proven runnable at build time.
      - name: Registry-mode binary build (macOS arm64)
        run: |
          set -euo pipefail
          python3 scripts/release_checks.py binary-build \
            --source registry --target aarch64-apple-darwin \
            --inventory "${{ runner.temp }}/release-macos/candidate/inventory.json" \
            --package-dir "${{ runner.temp }}/release-macos/candidate" \
            --output "${{ runner.temp }}/release-macos/output" \
            --toolchain 1.98.1

      # Same-tag retries of older tags execute that tag's producer; see
      # the Linux job for the legacy-pin rationale.
      - name: Pin legacy inputs to verified registry archives
        run: |
          set -euo pipefail
          OUT="${{ runner.temp }}/release-macos/output"
          if jq -e '.archives_dir' "$OUT/build-inputs.json" > /dev/null; then
            echo "build inputs record archives_dir; no pin needed"
          else
            jq --arg home "$OUT/verified-archives" '.package_dir = $home' \
              "$OUT/build-inputs.json" > "$OUT/build-inputs.pinned.json"
            mv "$OUT/build-inputs.pinned.json" "$OUT/build-inputs.json"
          fi

      - name: Notices + bundle
        id: stage
        run: |
          set -euo pipefail
          OUT="${{ runner.temp }}/release-macos/output"
          python3 scripts/release_checks.py notices --build-inputs "$OUT/build-inputs.json" --output "$OUT/notices"
          python3 scripts/release_checks.py bundle --binaries "$OUT/binaries" --provenance "$OUT/build-provenance.json" --notices "$OUT/notices" --output "$OUT/staged-bundle" --timestamp "$TAG_DATE" --inventory "${{ runner.temp }}/release-macos/candidate/inventory.json" --package-dir "${{ runner.temp }}/release-macos/candidate"
          ARCHIVES=( "$OUT/staged-bundle"/*.tar.gz )
          if [ "${#ARCHIVES[@]}" -ne 1 ]; then
            echo "::error::expected exactly one macOS bundle tarball"
            exit 1
          fi
          echo "bundle=$(basename "${ARCHIVES[0]}")" >> "$GITHUB_OUTPUT"

      - name: Upload macOS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-bundle-${{ inputs.tag }}
          path: ${{ runner.temp }}/release-macos/output/staged-bundle/
          if-no-files-found: error
          retention-days: 90

  smoke-linux:
    name: Smoke registry Linux bundle (extracted paths)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    needs: [recover, binary-linux]
    steps:
      - name: Checkout tag tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install SoftHSM2 + pkcs11-tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y softhsm2 opensc

      - name: Download Linux bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-bundle-${{ inputs.tag }}
          path: ${{ runner.temp }}/release-smoke-linux/bundle

      - name: Extracted-bundle provider smoke
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/release-smoke-linux/work"
          python3 scripts/ci-package-smoke.py linux-bundle \
            --bundle "${{ runner.temp }}/release-smoke-linux/bundle/${{ needs.binary-linux.outputs.bundle }}" \
            --workdir "${{ runner.temp }}/release-smoke-linux/work"

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-smoke-linux-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/release-smoke-linux/work/
          retention-days: 90

  smoke-windows:
    name: Smoke registry Windows bundle (${{ matrix.os }}, native)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: [recover, binary-windows]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - name: Checkout tag tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      # The pinned SoftHSM DLLs and the MSVC-built binaries need the
      # desktop CRT, exposed via PATH from the VS installation (never the
      # hanging vc_redist installer, never bundled DLLs).
      - name: Expose MSVC x64 runtime (Windows)
        run: |
          VSWHERE="C:/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          VSDIR=$("$VSWHERE" -latest -property installationPath | tr -d '\r')
          REDIST_DLL=$(find "$VSDIR/VC/Redist/MSVC" -path '*x64*' -name 'vcruntime140.dll' -not -path '*onecore*' 2>/dev/null | sort -V | tail -1)
          if [ -z "$REDIST_DLL" ]; then
            echo "no x64 vcruntime140.dll under $VSDIR/VC/Redist/MSVC"
            exit 1
          fi
          REDIST=$(dirname "$REDIST_DLL")
          echo "$REDIST" >> "$GITHUB_PATH"
          echo "MSVC x64 redist: $REDIST"
        shell: bash

      - name: Download Windows bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-windows-bundle-${{ inputs.tag }}
          path: ${{ runner.temp }}/release-smoke-windows/bundle

      - name: Native ZIP provider smoke
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-smoke-windows/work"
          python3 scripts/ci-package-smoke.py windows-bundle \
            --bundle "$RUNNER_TEMP/release-smoke-windows/bundle/${{ needs.binary-windows.outputs.bundle }}" \
            --workdir "$RUNNER_TEMP/release-smoke-windows/work"
        shell: bash

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-smoke-windows-logs-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/release-smoke-windows/work/
          retention-days: 90

  smoke-macos:
    name: Smoke registry macOS bundle (native)
    runs-on: macos-15
    timeout-minutes: 60
    needs: [recover, binary-macos]
    steps:
      - name: Checkout tag tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install SoftHSM2 + pkcs11-tool
        run: brew install softhsm opensc

      - name: Download macOS bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-macos-bundle-${{ inputs.tag }}
          path: ${{ runner.temp }}/release-smoke-macos/bundle

      - name: Extracted-bundle provider smoke
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/release-smoke-macos/work"
          python3 scripts/ci-package-smoke.py macos-bundle \
            --bundle "${{ runner.temp }}/release-smoke-macos/bundle/${{ needs.binary-macos.outputs.bundle }}" \
            --workdir "${{ runner.temp }}/release-smoke-macos/work"

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-smoke-macos-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/release-smoke-macos/work/
          retention-days: 90

  publish:
    name: Publish GitHub release (non-destructive)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: [recover, binary-linux, binary-windows, binary-macos, smoke-linux, smoke-windows, smoke-macos]
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout tag for release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      # The tag checkout above predates scripts/release-upload.sh, so fetch
      # just the script from the workflow ref (the same ref this file runs
      # from) into a side directory; the tag checkout stays put for notes.
      - name: Checkout uploader script from workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            scripts/release-upload.sh
          path: .release-uploader

      - name: Install Python for release checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Download prepared Linux bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-bundle-${{ inputs.tag }}
          path: prepared/

      - name: Download prepared Windows bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-windows-bundle-${{ inputs.tag }}
          path: prepared/

      - name: Download prepared macOS bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-macos-bundle-${{ inputs.tag }}
          path: prepared/

      - name: Download recovered candidate evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evidence-${{ github.run_id }}
          path: evidence/

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          RELEASE_VERSION="${RELEASE_TAG#v}"
          RELEASE_VERSION="${RELEASE_VERSION%%-*}"
          VER_ESCAPED="${RELEASE_VERSION//./\\.}"
          VER_ESCAPED="$VER_ESCAPED" awk '
            $0 ~ "^## \\[" ENVIRON["VER_ESCAPED"] "\\]" { flag=1; next }
            /^## \[/ && flag           { flag=0 }
            flag                       { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::CHANGELOG.md has no section for version ${RELEASE_VERSION}."
            exit 1
          fi

      # Compare-then-stage: identical assets stay on the release untouched,
      # missing assets are staged for upload, divergent bytes refuse here.
      # Nothing is ever replaced, deleted, or moved by a retry.
      - name: Compare prepared assets with the release
        id: compare
        run: |
          set -euo pipefail
          mkdir -p existing stage
          if gh release view "$RELEASE_TAG" --json assets \
              --jq '.assets[].name' > existing/names.txt 2>/dev/null; then
            while IFS= read -r ASSET; do
              [ -n "$ASSET" ] || continue
              gh release download "$RELEASE_TAG" -p "$ASSET" -D existing/files
            done < existing/names.txt
          else
            : > existing/names.txt
          fi
          python3 - <<'EOF' > existing/assets.json
          import hashlib, json
          from pathlib import Path
          assets = []
          # Immune to self-inclusion: the manifest lives at existing/
          # while globbing existing/files/ (contrast prepared/ below).
          for path in sorted(Path("existing/files").glob("*")):
              if path.is_file():
                  assets.append({"name": path.name,
                                 "sha256": hashlib.sha256(path.read_bytes()).hexdigest()})
          print(json.dumps(assets))
          EOF
          cp evidence/inventory.json evidence/qualification-binding.json prepared/
          # Durable retention: the validated qualification record,
          # receipt, and complete evidence bundle ship as release
          # assets alongside provenance, not just 90-day run
          # artifacts. The bundle archive preserves the relative
          # layout; the assets manifest below pins its digest.
          cp evidence/qualification-record.json evidence/qualification-receipt.json prepared/
          cp evidence/qualification-evidence.tar.gz prepared/
          python3 - <<'EOF' > prepared/assets.json
          import hashlib, json
          from pathlib import Path
          assets = []
          # The redirect creates prepared/assets.json BEFORE this glob runs,
          # so exclude it: a self-entry hashes the half-written file and can
          # never match the released bytes, which wedged v0.2.2's retry with
          # a divergent refusal (v0.2.1 silently shipped such an entry).
          # The manifest file itself is compared by bytes below instead.
          for path in sorted(Path("prepared").glob("*")):
              if path.is_file() and path.name != "assets.json":
                  assets.append({"name": path.name, "path": str(path),
                                 "sha256": hashlib.sha256(path.read_bytes()).hexdigest()})
          print(json.dumps(assets))
          EOF
          DECISION="$(python3 scripts/release_checks.py assets-compare \
            --existing-json existing/assets.json \
            --prepared-json prepared/assets.json | tail -1)"
          echo "$DECISION"
          ADD_COUNT="$(python3 -c 'import json,sys; print(len(json.load(sys.stdin)["assets_compare"]["add"]))' <<<"$DECISION")"
          python3 -c 'import json,sys; print("\n".join(json.load(sys.stdin)["assets_compare"]["add"]))' <<<"$DECISION" > stage/add.txt
          while IFS= read -r ASSET; do
            [ -n "$ASSET" ] || continue
            cp "prepared/${ASSET}" stage/
          done < stage/add.txt
          # The manifest is a published asset but cannot list itself (see
          # above), so compare it by bytes: missing stages it, identical
          # skips it, anything else refuses like any divergent asset.
          if [ -f existing/files/assets.json ]; then
            if ! cmp -s existing/files/assets.json prepared/assets.json; then
              echo "::error::released assets.json differs from the prepared manifest; refusing to replace"
              exit 1
            fi
          else
            cp prepared/assets.json stage/
            echo "assets.json" >> stage/add.txt
            ADD_COUNT=$((ADD_COUNT + 1))
          fi
          echo "add_count=${ADD_COUNT}" >> "$GITHUB_OUTPUT"

      # Release-binding predicate: the bundles attest to the tag,
      # tag commit, and qualification that produced them — NOT to
      # "built by this workflow run" (binaries come from registry
      # archives in the binary jobs, and this workflow may run from
      # main, so stock build provenance would mislead). Subjects are
      # the explicit prepared bundles, including identical retained
      # ones: on a retry, stage/ holds only missing files, but every
      # bundle on the release needs an attestation.
      - name: Write release-binding predicate
        id: predicate
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import glob
          import json
          import os
          from pathlib import Path
          bundles = sorted(str(path)
                           for pattern in ("prepared/*.tar.gz",
                                           "prepared/*.zip")
                           for path in glob.glob(pattern))
          if not bundles:
              raise SystemExit("::error::no prepared bundles to attest")
          binding = json.loads(
              Path("evidence/qualification-binding.json").read_text())
          predicate = {
              "tag": os.environ["RELEASE_TAG"],
              "repository": "${{ github.repository }}",
              "tag_commit": binding["tag_commit"],
              "candidate_run_id": binding["run_id"],
              "qualification": {
                  "url": binding["qualification_url"],
                  "subject": binding["qualification_subject"],
                  "record_sha256":
                      binding["qualification_record_sha256"],
                  "receipt_sha256":
                      binding["qualification_receipt_sha256"],
                  "run_id": binding["qualification_run_id"],
                  "framework": binding["qualification_framework"],
              },
              "built_from": "registry",
          }
          Path("attest").mkdir(exist_ok=True)
          Path("attest/release-binding.json").write_text(
              json.dumps(predicate, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("subjects<<SUBJECTS_EOF\n")
              out.write("\n".join(bundles) + "\n")
              out.write("SUBJECTS_EOF\n")
          EOF

      - name: Attest release bundles
        uses: actions/attest@ce27ba3b4a9a139d9a20a4a07d69fabb52f1e5bc # v2
        with:
          subject-path: ${{ steps.predicate.outputs.subjects }}
          predicate-type: https://github.com/mingulov/pkcs11-proxy-ng/release-binding/v1
          predicate-path: attest/release-binding.json

      # Upload with retries: the softprops action it replaces has a fixed
      # 10s connect timeout and no retries, which failed v0.2.2 on a
      # transient uploads.github.com stall (neither the action nor gh
      # expose a timeout knob). Same create-or-extend semantics over the
      # staged (missing-only) files; see scripts/release-upload.sh.
      - name: Create or extend the GitHub release
        if: steps.compare.outputs.add_count != '0'
        run: .release-uploader/scripts/release-upload.sh
        env:
          RELEASE_TITLE: pkcs11-proxy-ng ${{ inputs.tag }}
          RELEASE_NOTES: RELEASE_NOTES.md
