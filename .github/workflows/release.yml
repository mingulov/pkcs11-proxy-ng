# Release workflow
#
# Builds release binaries on tag push (vX.Y.Z), packages them into a tarball
# with SHA-256 checksums, extracts release notes from CHANGELOG.md for the
# matching version, and creates a GitHub Release with the assets attached.
#
# Trigger: push an annotated tag matching v*.  The workflow validates the
# tag format (vMAJOR.MINOR.PATCH[-suffix]) before doing anything else and
# fails loudly if CHANGELOG.md has no matching section.
#
# To cut a release:
#   git tag -a vX.Y.Z -m "..."
#   git push origin vX.Y.Z
#
# Topology: the build job compiles and packages the Linux bundle, the
# build-windows job cross-compiles the Windows x64 (MSVC) bundle with
# cargo-xwin (no Windows runner), and the publish job (gated on the
# `release` environment) attaches both jobs' dist/ artifacts to the tag
# release via the two softprops steps. Preparation and publication are
# separate jobs so a reviewer must approve before anything publishes.
#
# Security notes:
#   - GITHUB_REF_NAME is read directly as a shell env var; no `${{ }}`
#     interpolation of tag-derived strings into shell scripts.
#   - The tag format is validated before any further command uses it,
#     so a malformed or injection-style tag fails fast.

name: release

on:
  push:
    tags:
      - 'v*'

# W1-L17-21: least privilege — the default token reads (checkout); only
# the publish job (softprops/action-gh-release) gets contents:write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Linux release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The receipt step compares against HEAD~1 and diffs HEAD~1..HEAD,
          # so the checkout must contain at least the tag commit and its parent.
          fetch-depth: 2

      - name: Validate tag format
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match vMAJOR.MINOR.PATCH[-suffix]; refusing to release."
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME validated"

      - name: Verify release subject
        run: scripts/verify-release-subject.sh "$GITHUB_REF_NAME"

      - name: Verify quality receipt
        run: |
          set -euo pipefail
          # W1-L17-02: the receipt path follows the tag version (suffix
          # stripped, same rule as verify-release-subject.sh), so a new
          # version needs no workflow edit.
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TAG_VERSION="${TAG_VERSION%%-*}"
          if [[ ! "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' does not name a MAJOR.MINOR.PATCH version; refusing to release."
            exit 1
          fi
          RECEIPT="doc/release/v${TAG_VERSION}-quality-receipt.md"
          if [[ ! -f "$RECEIPT" ]]; then
            echo "::error::quality receipt $RECEIPT is missing; refusing to release."
            exit 1
          fi
          SUBJECT_SHA="$(sed -nE 's/^subject_sha: ([0-9a-fA-F]+)$/\1/p' "$RECEIPT")"
          SUBJECT_COMMIT="$(git rev-parse HEAD~1)"
          TAG_COMMIT="$(git rev-parse HEAD)"
          if [[ "$SUBJECT_SHA" != "$SUBJECT_COMMIT" ]]; then
            echo "::error::quality receipt subject_sha '$SUBJECT_SHA' does not equal frozen subject '$SUBJECT_COMMIT' (HEAD~1 of tag commit '$TAG_COMMIT'); refusing to release."
            exit 1
          fi
          for gate in fmt check test clippy msrv audit deny release_dry_run; do
            value="$(sed -nE "s/^${gate}: (.*)$/\1/p" "$RECEIPT")"
            case "$value" in
              pass) ;;
              *)
                echo "::error::quality receipt gate '$gate' verdict is not exactly 'pass' (got '$value'); refusing to release."
                exit 1
                ;;
            esac
          done
          DELTA_PATHS="$(git diff --name-only "$SUBJECT_COMMIT" "$TAG_COMMIT")"
          while IFS= read -r path; do
            if [[ -z "$path" ]]; then continue; fi
            case "$path" in
              "$RECEIPT"|CHANGELOG.md) ;;
              *)
                echo "::error::tag commit '$TAG_COMMIT' changes '$path', outside the receipt/CHANGELOG bookkeeping delta; refusing to release."
                exit 1
                ;;
            esac
          done <<<"$DELTA_PATHS"
          echo "quality receipt verified for subject $SUBJECT_COMMIT at tag commit $TAG_COMMIT"

      - name: Install protoc (pinned, matches mise.toml)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          # W1-L16-13: single protoc version everywhere; must match
          # mise.toml.
          version: "36.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned Rust toolchain (must satisfy MSRV from Cargo.toml)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Build release artifacts via existing dry-run script
        run: scripts/release-dry-run.sh

      - name: Smoke-test built binaries
        run: |
          target/release/pkcs11-proxy-ng --version
          target/release/pkcs11-proxy-ng-cli --version
          file target/release/libpkcs11_proxy_ng_shim.so

      - name: Package release tarball + checksums
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          TARGET="$(rustc -vV | awk '/^host:/ {print $2}')"
          BUNDLE="pkcs11-proxy-ng-${GITHUB_REF_NAME}-${TARGET}"

          mkdir -p "dist/${BUNDLE}/bin" "dist/${BUNDLE}/lib/pkcs11" "dist/${BUNDLE}/doc"
          cp target/release/pkcs11-proxy-ng           "dist/${BUNDLE}/bin/"
          cp target/release/pkcs11-proxy-ng-cli       "dist/${BUNDLE}/bin/"
          cp target/release/libpkcs11_proxy_ng_shim.so "dist/${BUNDLE}/lib/pkcs11/"
          cp README.md CHANGELOG.md LICENSE-APACHE LICENSE-MIT "dist/${BUNDLE}/"
          cp doc/release/beta-support-matrix.md doc/release/mtls-setup.md \
             doc/release/parity-validation.md doc/release/v0.2.0-release-notes.md \
             "dist/${BUNDLE}/doc/"

          strip "dist/${BUNDLE}/bin/"* "dist/${BUNDLE}/lib/pkcs11/"*.so

          TAG_DATE="$(git log -1 --format=%cI "$GITHUB_REF_NAME")"
          # W1-L17-04: GZIP=-n suppresses the gzip header timestamp/name so
          # the tarball is byte-reproducible like the Windows ZIP.
          ( cd dist && GZIP=-n tar --owner=0 --group=0 --mtime="$TAG_DATE" \
                  -czf "${BUNDLE}.tar.gz" "${BUNDLE}" )
          ( cd dist && sha256sum "${BUNDLE}.tar.gz" > SHA256SUMS )

          ls -la dist/
          cat dist/SHA256SUMS

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # W1-L17-17: dot-escape so the version matches literally in the
          # awk regex (same rule as verify-release-subject.sh BASE_ESCAPED;
          # the tag-format validation above guarantees the remaining
          # charset is regex-literal). Passed via the environment because
          # awk -v would process the backslash escapes itself.
          VER_ESCAPED="${VERSION//./\\.}"
          VER_ESCAPED="$VER_ESCAPED" awk '
            $0 ~ "^## \\[" ENVIRON["VER_ESCAPED"] "\\]" { flag=1; next }
            /^## \[/ && flag           { flag=0 }
            flag                       { print }
          ' CHANGELOG.md > dist/RELEASE_NOTES.md

          if [ ! -s dist/RELEASE_NOTES.md ]; then
            echo "::error::CHANGELOG.md has no section for version ${VERSION} — refusing to publish empty release notes."
            echo "Expected a heading like: ## [${VERSION}] - YYYY-MM-DD"
            exit 1
          fi

          echo "--- release notes ---"
          cat dist/RELEASE_NOTES.md

      - name: Upload Linux dist artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: linux-dist
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md
          if-no-files-found: error

  build-windows:
    name: Build Windows release bundle
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate tag format
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match vMAJOR.MINOR.PATCH[-suffix]; refusing to release."
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME validated"

      - name: Install LLVM (clang/lld) + nasm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld nasm

      - name: Install protoc (pinned, matches mise.toml)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "36.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned toolchain with Windows MSVC target
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-xwin
        run: cargo install cargo-xwin --version 0.23.1 --locked

      - name: Build deterministic Windows bundle via release script
        run: scripts/release-windows.sh --prefix dist/win-stage

      - name: Verify Windows checksums
        run: |
          set -euo pipefail
          ( cd dist/win-stage && sha256sum -c SHA256SUMS-windows )

      - name: Upload Windows dist artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: windows-dist
          path: |
            dist/win-stage/*.zip
            dist/win-stage/SHA256SUMS-windows
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: [build, build-windows]
    environment: release
    permissions:
      contents: write   # required to create the GitHub Release
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Download Linux dist artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: linux-dist
          path: dist/

      - name: Download Windows dist artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: windows-dist
          path: dist/win-stage/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: pkcs11-proxy-ng ${{ github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true

      - name: Append Windows assets to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/win-stage/*.zip
            dist/win-stage/SHA256SUMS-windows
          fail_on_unmatched_files: true
