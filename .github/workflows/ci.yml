# Tier 0 — Fast PR checks
#
# Runs on every push and pull request.  Must complete quickly (< 5 min) to
# give fast feedback.  Does NOT require any external dependencies beyond the
# Rust toolchain and protobuf compiler.
#
# Checks performed:
#   cargo fmt --check   — formatting gate
#   shellcheck          — shell hygiene gate (all scripts/**.sh, pinned 0.11.0)
#   cargo audit         — RustSec advisory gate (workspace + standalone locks)
#   cargo deny check    — license/ban/source policy gate (workspace + standalone)
#   cargo build         — compilation gate (all workspace crates)
#   cargo test          — unit + integration tests that don't require #[ignore]
#   cargo clippy        — linting gate for all targets/features (-D warnings)
#
# Supply-chain pinning (W1-L16-09/10/13): every third-party action below is
# pinned to a commit SHA (trailing `# <tag>` records the tag it was taken
# from so bumps stay reviewable); the Rust toolchain is the pinned
# rust-toolchain.toml channel (MSRV keeps 1.88); protoc is setup-protoc at
# the mise.toml version (36.1). All cargo builds/tests run --locked.
#
# Job hygiene (W1-L17-07): every job sets timeout-minutes — none inherits
# the 6h default. The local_quality_gate_test ci_jobs_all_set_timeouts gate
# enforces this per-PR.
#
# See .github/workflows/nightly.yml for Tier 2-3 provider-matrix and
# consumer interoperability jobs (scheduled, not per-PR).

name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
  workflow_dispatch:

# W1-L17-20: superseded PR runs cancel instead of queueing full matrices
# behind them; main/dev pushes are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Tier 0a: formatting ────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned toolchain with rustfmt
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # Must match rust-toolchain.toml (W1-L16-09); the action's
          # RUSTUP_TOOLCHAIN export overrides the file, so the pin is
          # repeated here rather than inherited.
          toolchain: 1.98.1
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  # ── Tier 0b: dependency advisory audit ────────────────────────────────────
  audit:
    name: Cargo Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: fmt
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Cache cargo audit binary
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.22.2

      - name: Install cargo-audit
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi

      - name: cargo audit
        run: cargo audit

      # W1-L16-14: the standalone test workspaces carry their own locks;
      # audit them too so advisories there fail the gate.
      - name: cargo audit (standalone test workspaces)
        run: scripts/audit-test-workspaces.sh audit

  # ── Tier 0b2: dependency policy (licenses / bans / sources) ───────────────
  # deny.toml carries the strict license allowlist, source pinning, and ban
  # rules from the 2026-06 security review; this job makes it enforced
  # rather than decorative. cargo-audit (above) covers advisories with the
  # RustSec DB; `cargo deny check` additionally gates licenses/bans/sources.
  deny:
    name: Cargo Deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: fmt
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Cache cargo deny binary
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny-0.20.2

      - name: Install cargo-deny
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install cargo-deny --version 0.20.2 --locked
          fi

      - name: cargo deny check
        run: cargo deny check

      # W1-L16-14: same standalone-lock coverage as the audit job.
      - name: cargo deny check (standalone test workspaces)
        run: scripts/audit-test-workspaces.sh deny

  # ── Tier 0b3: packaging smoke (APK/RPM mirrors + syntax) ───────────────────
  # W1-L17-05: full carrier-image builds run in external GitLab by design
  # (.gitlab-ci.yml header records the split); this job is the fast per-PR
  # signal — version-mirror agreement plus APKBUILD/spec shape — so
  # packaging regressions fail on the PR, not in external GitLab.
  # Checkout + bash only (the smoke reads Cargo.toml directly, needs no
  # Rust toolchain).
  packaging-smoke:
    name: Packaging smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: fmt
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: packaging mirrors + syntax
        run: scripts/packaging-smoke.sh

  # ── Tier 0b4: shell hygiene (shellcheck + bash -n) ──────────────────────────
  # W1-L17-12: mise.toml pins shellcheck 0.11.0 and G-8 requires a clean
  # shellcheck run; this job enforces it over every scripts/**/*.sh so
  # the release-critical scripts (verify-release-subject, release-dry-run)
  # cannot regress unchecked. Checkout + curl only (no Rust toolchain).
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: fmt
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install shellcheck (pinned)
        run: |
          set -euo pipefail
          # Single version everywhere: must match mise.toml.
          SC_VERSION="0.11.0"
          # TOFU-pinned 2026-09-22 from the v0.11.0 release assets (same
          # precedent as the protoc/Kryoptic pins in Dockerfile.test).
          SC_SHA256="8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SC_VERSION}/shellcheck-v${SC_VERSION}.linux.x86_64.tar.xz" -o /tmp/shellcheck.tar.xz
          echo "${SC_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJ -C /tmp -f /tmp/shellcheck.tar.xz
          sudo install -m755 "/tmp/shellcheck-v${SC_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: shellcheck all scripts
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find scripts -name '*.sh' | sort)
          echo "shell scripts: ${#scripts[@]}"
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          # From scripts/ so the `# shellcheck source=lib/...`
          # annotations resolve under -x (follow-sources).
          ( cd scripts && shellcheck -x $(find . -name '*.sh' | sort) )

  # ── Tier 0c: build, test, clippy ──────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [fmt, audit, deny]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install protoc (pinned, matches mise.toml)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          # W1-L16-13: single protoc version everywhere; must match
          # mise.toml. The default token raises the API quota for
          # version resolution (same rate-limit hardening as
          # cross-platform.yml).
          version: "36.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned toolchain with clippy
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          components: clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo build --workspace --locked
        run: cargo build --workspace --locked

      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked

      # T2run-fix1 (prod M1): the fork-after-init regression tests are
      # #[ignore]-gated (harness-fork convention), so the suite above
      # never runs them — this step re-pins them explicitly. Unix-only
      # file (#![cfg(unix)]); no daemon needed (pre-init paths only).
      - name: Fork regression pin (shim --ignored)
        run: cargo test --locked -p pkcs11-proxy-ng-shim --test fork_after_init -- --ignored

      - name: cargo clippy --workspace --all-targets --all-features -- -D warnings
        run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings

  # ── Tier 0d: MSRV check ────────────────────────────────────────────────────
  # Validates that the workspace compiles on the minimum Rust version declared
  # in the workspace Cargo.toml (currently 1.88).  Separate job so MSRV
  # failures don't block the main test feedback.
  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: fmt
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install protoc (pinned, matches mise.toml)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "36.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Hard-coded to match rust-version in workspace Cargo.toml.
      # Update both places when the MSRV is bumped.
      - name: Install Rust 1.88 (MSRV)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.88

      # W1-L16-16: locked, all-targets (libs + bins + tests + examples +
      # benches), plus the test suite — the declared rust-version gate.
      - name: cargo build --workspace --locked --all-targets (MSRV)
        run: cargo build --workspace --locked --all-targets

      - name: cargo test --workspace --locked (MSRV)
        run: cargo test --workspace --locked

  # ── Tier 0e: narrow-CK_ULONG targets (i686) ────────────────────────────────
  # Compiles + tests for a 32-bit-CK_ULONG target (i686-unknown-linux-gnu,
  # ILP32). This is the surfacing mechanism for the narrow-CK_ULONG width
  # bridge (ADR-0011): it catches ABI/width gaps — compile-time
  # `CK_ULONG`-as-u32 conversions AND runtime width assumptions such as
  # 8-byte ulong attribute encodings — that the x86_64 build cannot.
  #
  # Runs the full shim lib suite (dispatch units + the TestDaemon integration
  # modules), the backend lib suite (MockBackend emulates a narrow-native
  # backend here; D4 checked-narrowing reject tests take their narrow branch),
  # the SERVER lib suite (the 32-bit daemon host is a supported D3 target),
  # the pure width logic (types), and an ABI compile of the client crates plus
  # the daemon binary. Real-.so backend tests skip themselves on ELF-class
  # mismatch (64-bit provider modules cannot load into a 32-bit process).
  # Live cross-width topologies (i686 daemon + i386 SoftHSM2) run via
  # scripts/run-cross-width-live-test.sh outside the per-PR gate.
  narrow-client-i686:
    name: Narrow CK_ULONG targets (i686)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: fmt
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install system dependencies (32-bit toolchain for ring)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-multilib libc6-dev-i386

      - name: Install protoc (pinned, matches mise.toml)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "36.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned toolchain with i686 target
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          targets: i686-unknown-linux-gnu

      - name: cargo test types + shim + backend + server (i686)
        run: |
          cargo test --locked --target i686-unknown-linux-gnu -p pkcs11-proxy-ng-types
          cargo test --locked --target i686-unknown-linux-gnu -p pkcs11-proxy-ng-shim --lib
          cargo test --locked --target i686-unknown-linux-gnu -p pkcs11-proxy-ng-backend --lib
          cargo test --locked --target i686-unknown-linux-gnu -p pkcs11-proxy-ng --lib

      - name: cargo build client crates + daemon (i686 ABI compile)
        run: |
          cargo build --locked --target i686-unknown-linux-gnu \
            -p pkcs11-proxy-ng-shim \
            -p pkcs11-proxy-ng-client \
            -p pkcs11-proxy-ng

  # ── Tier 0f: Windows build (LLP64, x86_64-pc-windows-msvc) ──────────────────
  # Cross-compiles the client shim AND the daemon for Windows x64 via
  # cargo-xwin (no Windows runner / no Wine needed). This is the LLP64 edge of
  # ADR-0011: 64-bit pointers + 32-bit CK_ULONG + `#pragma pack(1)`. Catches
  # Windows-only ABI gaps (packed-field E0793, Unix-only deps). The daemon is
  # mTLS-TCP-only on Windows: the UDS/peer-cred transport is compiled out and
  # config validation rejects [listener.local] there.
  # --all-targets coverage (T1): compiles libs, bins, tests, examples, and
  # benches so packed-field E0793 fallout and fork-gated helpers stay green.
  # i686 executes natively via multilib (Tier 0e): no binfmt/QEMU anywhere.
  # 32-bit-musl is intentionally absent: the musl claim is x86_64 Alpine
  # packaging only.
  windows-client-llp64:
    name: Windows client shim (LLP64, cargo-xwin)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: fmt
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install LLVM (clang/lld/llvm-lib) + nasm
        run: |
          sudo apt-get update -qq
          # llvm: cc-rs needs llvm-lib (MSVC librarian) to cross-build
          # ring for windows-msvc (T2run: xwin red without it).
          sudo apt-get install -y clang lld llvm nasm

      - name: Install protoc (pinned, matches mise.toml)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "36.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned toolchain with Windows MSVC target
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-xwin
        run: cargo install cargo-xwin --version 0.23.1 --locked

      - name: cargo xwin build (client shim + daemon, Windows x64)
        run: |
          cargo xwin build --locked --target x86_64-pc-windows-msvc --all-targets \
            -p pkcs11-proxy-ng-shim \
            -p pkcs11-proxy-ng-client \
            -p pkcs11-proxy-ng-backend \
            -p pkcs11-proxy-ng

  # ── Tier 0g: musl build (x86_64-unknown-linux-musl) ──────────────────────────
  # Release-bundle build for the musl tier (doc/release/musl-tier.md):
  # daemon + CLI fully static, plus a musl-dynamic daemon and the shim
  # cdylib (musl-dynamic: cdylib cannot link statically, and a static
  # daemon cannot dlopen provider modules — musl answers "Dynamic
  # loading not supported" — so the serving daemon stays musl-dynamic,
  # the same shape the Alpine APKBUILD ships). Ubuntu's musl-tools
  # ships `musl-gcc` — there is no triplet-prefixed
  # x86_64-linux-musl-gcc, and that wrong name was the freeze-gate
  # failure this job closes (T4). The static binaries also execute on
  # the glibc runner, so --version doubles as a smoke test; the
  # musl-dynamic daemon cannot execute here (no musl loader) and gets
  # a `file` receipt only — its live proof is the Alpine stage of
  # scripts/run-musl-test.sh. Load-bearing, not experimental.
  # i686-musl stays intentionally absent: the musl claim is x86_64
  # Alpine packaging only.
  musl-x86_64:
    name: musl build (x86_64 static + dynamic)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: fmt
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install system dependencies (musl toolchain)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools

      - name: Install protoc (pinned, matches mise.toml)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "36.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned toolchain with musl target
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-linux-musl

      - name: cargo build release daemon + CLI (musl, static)
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-musl \
            -p pkcs11-proxy-ng -p pkcs11-proxy-ng-cli
          # The dynamic daemon below overwrites release/pkcs11-proxy-ng
          # (same output path, different fingerprint); keep the static
          # binary for the linkage receipt.
          mkdir -p target/x86_64-unknown-linux-musl/static-save
          cp target/x86_64-unknown-linux-musl/release/pkcs11-proxy-ng \
             target/x86_64-unknown-linux-musl/static-save/

      - name: cargo build release shim + daemon (musl, dynamic)
        # Flags from scripts/musl-dynamic-link-flags.sh (shared with the
        # local docker route): -crt-static off (musl-dynamic) plus a -L
        # redirect resolving rustc's explicit -lgcc_s, which the
        # musl-gcc wrapper cannot resolve on its own.
        run: |
          export RUSTFLAGS="$(scripts/musl-dynamic-link-flags.sh "$RUNNER_TEMP/musl-dynamic-link")"
          echo "dynamic RUSTFLAGS: $RUSTFLAGS"
          cargo build --locked --release --target x86_64-unknown-linux-musl \
            -p pkcs11-proxy-ng-shim -p pkcs11-proxy-ng

      - name: Verify linkage + smoke static binaries
        run: |
          MUSL_RELEASE="target/x86_64-unknown-linux-musl/release"
          file "$MUSL_RELEASE/../static-save/pkcs11-proxy-ng" \
               "$MUSL_RELEASE/pkcs11-proxy-ng-cli" \
               "$MUSL_RELEASE/pkcs11-proxy-ng" \
               "$MUSL_RELEASE/libpkcs11_proxy_ng_shim.so"
          # Newer `file` says "static-pie linked", older "statically linked".
          file "$MUSL_RELEASE/../static-save/pkcs11-proxy-ng" \
               "$MUSL_RELEASE/pkcs11-proxy-ng-cli" \
            | grep -Eq "statically linked|static-pie linked"
          if file "$MUSL_RELEASE/../static-save/pkcs11-proxy-ng" \
               "$MUSL_RELEASE/pkcs11-proxy-ng-cli" \
             | grep -q "interpreter"; then
            echo "::error::static daemon/CLI carry a program interpreter (not static)"
            exit 1
          fi
          file "$MUSL_RELEASE/pkcs11-proxy-ng" \
            | grep -q "interpreter /lib/ld-musl-" || {
            echo "::error::dynamic daemon does not use the musl interpreter"
            exit 1
          }
          file "$MUSL_RELEASE/libpkcs11_proxy_ng_shim.so" | grep -q "shared object"
          # The static binaries execute on the glibc runner; the
          # musl-dynamic daemon cannot (no musl loader here).
          "$MUSL_RELEASE/../static-save/pkcs11-proxy-ng" --version
          "$MUSL_RELEASE/pkcs11-proxy-ng-cli" --version
