# Tier 0 — Fast PR checks
#
# Runs on every push and pull request.  Must complete quickly (< 5 min) to
# give fast feedback.  Does NOT require any external dependencies beyond the
# Rust toolchain and protobuf compiler.
#
# Checks performed:
#   cargo fmt --check   — formatting gate
#   cargo audit         — RustSec advisory gate
#   cargo build         — compilation gate (all workspace crates)
#   cargo test          — unit + integration tests that don't require #[ignore]
#   cargo clippy        — linting gate for all targets/features (-D warnings)
#
# See .github/workflows/nightly.yml for Tier 2-3 provider-matrix and
# consumer interoperability jobs (scheduled, not per-PR).

name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Tier 0a: formatting ────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install stable toolchain with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  # ── Tier 0b: dependency advisory audit ────────────────────────────────────
  audit:
    name: Cargo Audit
    runs-on: ubuntu-24.04
    needs: fmt
    steps:
      - uses: actions/checkout@v6

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo audit binary
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-v0

      - name: Install cargo-audit
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked
          fi

      - name: cargo audit
        run: cargo audit

  # ── Tier 0c: build, test, clippy ──────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-24.04
    needs: [fmt, audit]
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler

      - name: Install stable toolchain with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo build --workspace
        run: cargo build --workspace

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo clippy --workspace --all-targets --all-features -- -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ── Tier 0d: MSRV check ────────────────────────────────────────────────────
  # Validates that the workspace compiles on the minimum Rust version declared
  # in the workspace Cargo.toml (currently 1.88).  Separate job so MSRV
  # failures don't block the main test feedback.
  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-24.04
    needs: fmt
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler

      # Hard-coded to match rust-version in workspace Cargo.toml.
      # Update both places when the MSRV is bumped.
      - name: Install Rust 1.88 (MSRV)
        uses: dtolnay/rust-toolchain@1.88

      - name: cargo build --workspace (MSRV)
        run: cargo build --workspace

  # ── Tier 0e: narrow-CK_ULONG client (i686) ─────────────────────────────────
  # Compiles + tests for a 32-bit-CK_ULONG target (i686-unknown-linux-gnu,
  # ILP32). This is the surfacing mechanism for the narrow-CK_ULONG width
  # bridge (ADR-0011): it catches ABI/width gaps — compile-time
  # `CK_ULONG`-as-u32 conversions AND runtime width assumptions such as
  # 8-byte ulong attribute encodings — that the x86_64 build cannot.
  #
  # Runs the full shim lib suite (dispatch units + the TestDaemon integration
  # modules), the backend lib suite (MockBackend emulates a narrow-native
  # backend here), the pure width logic (types), and an ABI compile of the
  # client crates. Real-.so backend tests skip themselves on ELF-class
  # mismatch (64-bit provider modules cannot load into a 32-bit process).
  narrow-client-i686:
    name: Narrow CK_ULONG client (i686)
    runs-on: ubuntu-24.04
    needs: fmt
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies (protobuf + 32-bit toolchain for ring)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler gcc-multilib libc6-dev-i386

      - name: Install stable toolchain with i686 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu

      - name: cargo test types + shim + backend (i686)
        run: |
          cargo test --target i686-unknown-linux-gnu -p pkcs11-proxy-ng-types
          cargo test --target i686-unknown-linux-gnu -p pkcs11-proxy-ng-shim --lib
          cargo test --target i686-unknown-linux-gnu -p pkcs11-proxy-ng-backend --lib

      - name: cargo build client crates (i686 ABI compile)
        run: |
          cargo build --target i686-unknown-linux-gnu \
            -p pkcs11-proxy-ng-shim \
            -p pkcs11-proxy-ng-client

  # ── Tier 0f: Windows client shim (LLP64, x86_64-pc-windows-msvc) ────────────
  # Cross-compiles the client shim for Windows x64 via cargo-xwin (no Windows
  # runner / no Wine needed). This is the LLP64 edge of ADR-0011: 64-bit
  # pointers + 32-bit CK_ULONG + `#pragma pack(1)`. Catches Windows-only ABI
  # gaps (packed-field E0793, Unix-only deps). Only the client-side crates are
  # built; a Windows *server* is a separate, deployment-gated port (Bucket 3).
  windows-client-llp64:
    name: Windows client shim (LLP64, cargo-xwin)
    runs-on: ubuntu-24.04
    needs: fmt
    steps:
      - uses: actions/checkout@v6

      - name: Install protobuf + LLVM (clang/lld) + nasm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler clang lld nasm

      - name: Install stable toolchain with Windows MSVC target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-xwin
        run: cargo install cargo-xwin --locked

      - name: cargo xwin build (client shim, Windows x64)
        run: |
          cargo xwin build --target x86_64-pc-windows-msvc \
            -p pkcs11-proxy-ng-shim \
            -p pkcs11-proxy-ng-client
