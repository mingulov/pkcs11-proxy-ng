# Tier 0 — Fast PR checks
#
# Runs on every push and pull request.  Must complete quickly (< 5 min) to
# give fast feedback.  Does NOT require any external dependencies beyond the
# Rust toolchain and protobuf compiler.
#
# Checks performed:
#   cargo fmt --check   — formatting gate
#   shellcheck          — shell hygiene gate (all scripts/**.sh, pinned 0.11.0)
#   cargo audit         — RustSec advisory gate (workspace + standalone locks)
#   cargo deny check    — license/ban/source policy gate (workspace + standalone)
#   cargo build         — compilation gate (all workspace crates)
#   cargo test          — unit + integration tests that don't require #[ignore]
#   cargo clippy        — linting gate for all targets/features (-D warnings)
#   package candidate   — all-eight source archives + inventory + MSRV consumer
#   archive binaries    — archive-mode Linux/Windows builds + notices + bundles
#   artifact smokes     — Alpine APK install/sign, extracted Linux/Windows
#                         bundle provider-operation smokes (exact paths only)
#   ci-success          — fail-closed aggregate over every required job above
#
# Stage B (Task 5a): this workflow is reusable (workflow_call) so
# publication runs execute the identical required gate set as PRs. The
# APK build/install/sign and extracted-bundle runtime checks run on
# every PR and every publication run; see scripts/ci-package-smoke.py.
# Full Amazon RPM build/install remains outside this gate (see the
# smoke-apk-alpine job notes).
#
# Supply-chain pinning (W1-L16-09/10/13): every third-party action below is
# pinned to a commit SHA (trailing `# <tag>` records the tag it was taken
# from so bumps stay reviewable); the Rust toolchain is the pinned
# rust-toolchain.toml channel (MSRV keeps 1.88); protoc is setup-protoc at
# the mise.toml version (36.1). All cargo builds/tests run --locked.
#
# Job hygiene (W1-L17-07): every job sets timeout-minutes — none inherits
# the 6h default. The local_quality_gate_test ci_jobs_all_set_timeouts gate
# enforces this per-PR.
#
# See .github/workflows/nightly.yml for Tier 2-3 provider-matrix and
# consumer interoperability jobs (scheduled, not per-PR).

name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
  workflow_dispatch:
  # Stage B: publication workflows invoke the full required gate set via
  # workflow_call; the same jobs run for PR and publication calls (no
  # job gates on the event name except the always() aggregate).
  workflow_call:

# W1-L17-20: superseded PR runs cancel instead of queueing full matrices
# behind them; main/dev pushes are never cancelled.
# Stage B: the `ci-` namespace keeps a reusable invocation from
# conflicting with its caller (publication workflows use their own
# `publish-`/`release-` namespaces).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Tier 0a: formatting ────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned toolchain with rustfmt
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # Must match rust-toolchain.toml (W1-L16-09); the action's
          # RUSTUP_TOOLCHAIN export overrides the file, so the pin is
          # repeated here rather than inherited.
          toolchain: 1.98.1
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  # ── Tier 0b: dependency advisory audit ────────────────────────────────────
  audit:
    name: Cargo Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: fmt
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Cache cargo audit binary
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.22.2

      - name: Install cargo-audit
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi

      - name: cargo audit
        run: cargo audit

      # W1-L16-14: the standalone test workspaces carry their own locks;
      # audit them too so advisories there fail the gate.
      - name: cargo audit (standalone test workspaces)
        run: scripts/audit-test-workspaces.sh audit

  # ── Tier 0b2: dependency policy (licenses / bans / sources) ───────────────
  # deny.toml carries the strict license allowlist, source pinning, and ban
  # rules from the 2026-06 security review; this job makes it enforced
  # rather than decorative. cargo-audit (above) covers advisories with the
  # RustSec DB; `cargo deny check` additionally gates licenses/bans/sources.
  deny:
    name: Cargo Deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: fmt
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Cache cargo deny binary
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny-0.20.2

      - name: Install cargo-deny
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install cargo-deny --version 0.20.2 --locked
          fi

      - name: cargo deny check
        run: cargo deny check

      # W1-L16-14: same standalone-lock coverage as the audit job.
      - name: cargo deny check (standalone test workspaces)
        run: scripts/audit-test-workspaces.sh deny

  # ── Tier 0b3: packaging smoke (APK/RPM mirrors + syntax) ───────────────────
  # W1-L17-05: full carrier-image builds run in external GitLab by design
  # (.gitlab-ci.yml header records the split); this job is the fast per-PR
  # signal — version-mirror agreement plus APKBUILD/spec shape — so
  # packaging regressions fail on the PR, not in external GitLab.
  # Stage B adds GitHub carrier testing alongside (not instead of) this
  # gate and the GitLab matrix: the smoke-apk-alpine job builds the
  # Alpine APKs and runs an installed provider smoke; this mirror/syntax
  # gate stays. Checkout + bash only (the smoke reads Cargo.toml
  # directly, needs no Rust toolchain).
  packaging-smoke:
    name: Packaging smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: fmt
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: packaging mirrors + syntax
        run: scripts/packaging-smoke.sh

  # ── Tier 0b4: shell hygiene (shellcheck + bash -n) ──────────────────────────
  # W1-L17-12: mise.toml pins shellcheck 0.11.0 and G-8 requires a clean
  # shellcheck run; this job enforces it over every scripts/**/*.sh so
  # the release-critical scripts (verify-release-subject, release-dry-run)
  # cannot regress unchecked. Checkout + curl only (no Rust toolchain).
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: fmt
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install shellcheck (pinned)
        run: |
          set -euo pipefail
          # Single version everywhere: must match mise.toml.
          SC_VERSION="0.11.0"
          # TOFU-pinned 2026-09-22 from the v0.11.0 release assets (same
          # precedent as the protoc/Kryoptic pins in Dockerfile.test).
          SC_SHA256="8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SC_VERSION}/shellcheck-v${SC_VERSION}.linux.x86_64.tar.xz" -o /tmp/shellcheck.tar.xz
          echo "${SC_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJ -C /tmp -f /tmp/shellcheck.tar.xz
          sudo install -m755 "/tmp/shellcheck-v${SC_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: shellcheck all scripts
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find scripts -name '*.sh' | sort)
          echo "shell scripts: ${#scripts[@]}"
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          # From scripts/ so the `# shellcheck source=lib/...`
          # annotations resolve under -x (follow-sources).
          # SC2046: quoted array — the file list cannot word-split.
          mapfile -t shell_files < <(cd scripts && find . -name '*.sh' | sort)
          ( cd scripts && shellcheck -x "${shell_files[@]}" )

  # ── Tier 0c: build, test, clippy ──────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [fmt, audit, deny]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install protoc (pinned, matches mise.toml)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          # W1-L16-13: single protoc version everywhere; must match
          # mise.toml. The default token raises the API quota for
          # version resolution (same rate-limit hardening as
          # cross-platform.yml).
          version: "36.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned toolchain with clippy
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          components: clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo build --workspace --locked
        run: cargo build --workspace --locked

      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked

      # T2run-fix1 (prod M1): the fork-after-init regression tests are
      # #[ignore]-gated (harness-fork convention), so the suite above
      # never runs them — this step re-pins them explicitly. Unix-only
      # file (#![cfg(unix)]); no daemon needed (pre-init paths only).
      - name: Fork regression pin (shim --ignored)
        run: cargo test --locked -p pkcs11-proxy-ng-shim --test fork_after_init -- --ignored

      - name: cargo clippy --workspace --all-targets --all-features -- -D warnings
        run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings

  # ── Tier 0d: MSRV check ────────────────────────────────────────────────────
  # Validates that the workspace compiles on the minimum Rust version declared
  # in the workspace Cargo.toml (currently 1.88).  Separate job so MSRV
  # failures don't block the main test feedback.
  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: fmt
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install protoc (pinned, matches mise.toml)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "36.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Hard-coded to match rust-version in workspace Cargo.toml.
      # Update both places when the MSRV is bumped.
      - name: Install Rust 1.88 (MSRV)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.88

      # W1-L16-16: locked, all-targets (libs + bins + tests + examples +
      # benches), plus the test suite — the declared rust-version gate.
      - name: cargo build --workspace --locked --all-targets (MSRV)
        run: cargo build --workspace --locked --all-targets

      - name: cargo test --workspace --locked (MSRV)
        run: cargo test --workspace --locked

  # ── Tier 0e: narrow-CK_ULONG targets (i686) ────────────────────────────────
  # Compiles + tests for a 32-bit-CK_ULONG target (i686-unknown-linux-gnu,
  # ILP32). This is the surfacing mechanism for the narrow-CK_ULONG width
  # bridge (ADR-0011): it catches ABI/width gaps — compile-time
  # `CK_ULONG`-as-u32 conversions AND runtime width assumptions such as
  # 8-byte ulong attribute encodings — that the x86_64 build cannot.
  #
  # Runs the full shim lib suite (dispatch units + the TestDaemon integration
  # modules), the backend lib suite (MockBackend emulates a narrow-native
  # backend here; D4 checked-narrowing reject tests take their narrow branch),
  # the SERVER lib suite (the 32-bit daemon host is a supported D3 target),
  # the pure width logic (types), and an ABI compile of the client crates plus
  # the daemon binary. Real-.so backend tests skip themselves on ELF-class
  # mismatch (64-bit provider modules cannot load into a 32-bit process).
  # Live cross-width topologies (i686 daemon + i386 SoftHSM2) run via
  # scripts/run-cross-width-live-test.sh outside the per-PR gate.
  narrow-client-i686:
    name: Narrow CK_ULONG targets (i686)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: fmt
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install system dependencies (32-bit toolchain for ring)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-multilib libc6-dev-i386

      - name: Install protoc (pinned, matches mise.toml)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "36.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned toolchain with i686 target
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          targets: i686-unknown-linux-gnu

      - name: cargo test types + shim + backend + server (i686)
        run: |
          cargo test --locked --target i686-unknown-linux-gnu -p pkcs11-proxy-ng-types
          cargo test --locked --target i686-unknown-linux-gnu -p pkcs11-proxy-ng-shim --lib
          cargo test --locked --target i686-unknown-linux-gnu -p pkcs11-proxy-ng-backend --lib
          cargo test --locked --target i686-unknown-linux-gnu -p pkcs11-proxy-ng --lib

      - name: cargo build client crates + daemon (i686 ABI compile)
        run: |
          cargo build --locked --target i686-unknown-linux-gnu \
            -p pkcs11-proxy-ng-shim \
            -p pkcs11-proxy-ng-client \
            -p pkcs11-proxy-ng

  # ── Tier 0f: Windows build (LLP64, x86_64-pc-windows-msvc) ──────────────────
  # Cross-compiles the client shim AND the daemon for Windows x64 via
  # cargo-xwin (no Windows runner / no Wine needed). This is the LLP64 edge of
  # ADR-0011: 64-bit pointers + 32-bit CK_ULONG + `#pragma pack(1)`. Catches
  # Windows-only ABI gaps (packed-field E0793, Unix-only deps). The daemon is
  # mTLS-TCP-only on Windows: the UDS/peer-cred transport is compiled out and
  # config validation rejects [listener.local] there.
  # --all-targets coverage (T1): compiles libs, bins, tests, examples, and
  # benches so packed-field E0793 fallout and fork-gated helpers stay green.
  # i686 executes natively via multilib (Tier 0e): no binfmt/QEMU anywhere.
  # 32-bit-musl is intentionally absent: the musl claim is x86_64 Alpine
  # packaging only.
  windows-client-llp64:
    name: Windows client shim (LLP64, cargo-xwin)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: fmt
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install LLVM (clang/lld/llvm-lib) + nasm
        run: |
          sudo apt-get update -qq
          # llvm: cc-rs needs llvm-lib (MSVC librarian) to cross-build
          # ring for windows-msvc (T2run: xwin red without it).
          sudo apt-get install -y clang lld llvm nasm

      - name: Install protoc (pinned, matches mise.toml)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "36.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned toolchain with Windows MSVC target
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-xwin
        run: cargo install cargo-xwin --version 0.23.1 --locked

      - name: cargo xwin build (client shim + daemon, Windows x64)
        run: |
          cargo xwin build --locked --target x86_64-pc-windows-msvc --all-targets \
            -p pkcs11-proxy-ng-shim \
            -p pkcs11-proxy-ng-client \
            -p pkcs11-proxy-ng-backend \
            -p pkcs11-proxy-ng

  # ── Tier 0g: musl build (x86_64-unknown-linux-musl) ──────────────────────────
  # Release-bundle build for the musl tier (doc/release/musl-tier.md):
  # daemon + CLI fully static, plus a musl-dynamic daemon and the shim
  # cdylib (musl-dynamic: cdylib cannot link statically, and a static
  # daemon cannot dlopen provider modules — musl answers "Dynamic
  # loading not supported" — so the serving daemon stays musl-dynamic,
  # the same shape the Alpine APKBUILD ships). Ubuntu's musl-tools
  # ships `musl-gcc` — there is no triplet-prefixed
  # x86_64-linux-musl-gcc, and that wrong name was the freeze-gate
  # failure this job closes (T4). The static binaries also execute on
  # the glibc runner, so --version doubles as a smoke test; the
  # musl-dynamic daemon cannot execute here (no musl loader) and gets
  # a `file` receipt only — its live proof is the Alpine stage of
  # scripts/run-musl-test.sh. Load-bearing, not experimental.
  # i686-musl stays intentionally absent: the musl claim is x86_64
  # Alpine packaging only.
  musl-x86_64:
    name: musl build (x86_64 static + dynamic)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: fmt
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install system dependencies (musl toolchain)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools

      - name: Install protoc (pinned, matches mise.toml)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "36.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned toolchain with musl target
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-linux-musl

      - name: cargo build release daemon + CLI (musl, static)
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-musl \
            -p pkcs11-proxy-ng -p pkcs11-proxy-ng-cli
          # The dynamic daemon below overwrites release/pkcs11-proxy-ng
          # (same output path, different fingerprint); keep the static
          # binary for the linkage receipt.
          mkdir -p target/x86_64-unknown-linux-musl/static-save
          cp target/x86_64-unknown-linux-musl/release/pkcs11-proxy-ng \
             target/x86_64-unknown-linux-musl/static-save/

      - name: cargo build release shim + daemon (musl, dynamic)
        # Flags from scripts/musl-dynamic-link-flags.sh (shared with the
        # local docker route): -crt-static off (musl-dynamic) plus a -L
        # redirect resolving rustc's explicit -lgcc_s, which the
        # musl-gcc wrapper cannot resolve on its own.
        run: |
          # SC2155: separate assignment/export so a failing flag
          # generator propagates instead of being masked by export.
          RUSTFLAGS="$(scripts/musl-dynamic-link-flags.sh "$RUNNER_TEMP/musl-dynamic-link")"
          export RUSTFLAGS
          echo "dynamic RUSTFLAGS: $RUSTFLAGS"
          cargo build --locked --release --target x86_64-unknown-linux-musl \
            -p pkcs11-proxy-ng-shim -p pkcs11-proxy-ng

      - name: Verify linkage + smoke static binaries
        run: |
          MUSL_RELEASE="target/x86_64-unknown-linux-musl/release"
          file "$MUSL_RELEASE/../static-save/pkcs11-proxy-ng" \
               "$MUSL_RELEASE/pkcs11-proxy-ng-cli" \
               "$MUSL_RELEASE/pkcs11-proxy-ng" \
               "$MUSL_RELEASE/libpkcs11_proxy_ng_shim.so"
          # Newer `file` says "static-pie linked", older "statically linked".
          file "$MUSL_RELEASE/../static-save/pkcs11-proxy-ng" \
               "$MUSL_RELEASE/pkcs11-proxy-ng-cli" \
            | grep -Eq "statically linked|static-pie linked"
          if file "$MUSL_RELEASE/../static-save/pkcs11-proxy-ng" \
               "$MUSL_RELEASE/pkcs11-proxy-ng-cli" \
             | grep -q "interpreter"; then
            echo "::error::static daemon/CLI carry a program interpreter (not static)"
            exit 1
          fi
          file "$MUSL_RELEASE/pkcs11-proxy-ng" \
            | grep -q "interpreter /lib/ld-musl-" || {
            echo "::error::dynamic daemon does not use the musl interpreter"
            exit 1
          }
          file "$MUSL_RELEASE/libpkcs11_proxy_ng_shim.so" | grep -q "shared object"
          # The static binaries execute on the glibc runner; the
          # musl-dynamic daemon cannot (no musl loader here).
          "$MUSL_RELEASE/../static-save/pkcs11-proxy-ng" --version
          "$MUSL_RELEASE/pkcs11-proxy-ng-cli" --version

  # ── Tier 0h: source package candidate (archives + inventory + consumer) ─────
  # Stage B: packages all eight crates from the clean checkout with the
  # release compiler, verifies archive identity/inventory, and runs the
  # MSRV archive-consumer gates. The uploaded candidate artifact is the
  # only source-bound input downstream binary/smoke jobs may consume —
  # no shared or untrusted cache of candidate .crate files is used.
  # Compilation coverage comes from the consumer gate plus the
  # archive-binary jobs below, so packaging itself runs --no-verify.
  package-candidate:
    name: Package candidate (archives + consumer)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: fmt
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Both Cargo directories are isolated (the runner context is not
      # available in job-level env, so the temp-based paths are exported
      # here): the global build.build-dir config makes isolating the
      # target dir alone insufficient.
      - name: Isolate Cargo build and target directories
        run: |
          set -euo pipefail
          echo "CARGO_BUILD_BUILD_DIR=$RUNNER_TEMP/pkg-candidate/build" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/pkg-candidate/target" >> "$GITHUB_ENV"

      - name: Install protoc (pinned, matches mise.toml)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "36.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned toolchain (release)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Install Rust 1.88.0 (consumer MSRV)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.88.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Package all eight crates (clean, no-verify)
        run: |
          set -euo pipefail
          cargo +1.98.1 package --workspace --locked --no-verify

      - name: Verify archives + inventory
        run: |
          set -euo pipefail
          python3 scripts/release_checks.py archives \
            --package-dir "$CARGO_TARGET_DIR/package"

      - name: Archive consumer gates (MSRV 1.88.0)
        run: |
          set -euo pipefail
          python3 scripts/release_checks.py consumer \
            --package-dir "$CARGO_TARGET_DIR/package" --toolchain 1.88.0

      - name: Upload source-bound candidate
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ci-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CARGO_TARGET_DIR }}/package/*.crate
            ${{ env.CARGO_TARGET_DIR }}/package/inventory.json
            ${{ env.CARGO_TARGET_DIR }}/package/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  # ── Tier 0i: archive-mode Linux binary + notices + bundle ───────────────────
  # Stage B: builds the daemon/CLI/shim from the source-bound candidate
  # (never the checkout) with the release toolchain, then collects
  # notices and stages the deterministic tarball. Archive-source output
  # is a CI candidate, never publication evidence.
  archive-binary-linux:
    name: Archive binary build (Linux GNU) + notices/bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: package-candidate
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
    outputs:
      bundle: ${{ steps.stage.outputs.bundle }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Both Cargo directories are isolated: the global build.build-dir
      # config makes a target dir alone insufficient.
      - name: Isolate Cargo build and target directories
        run: |
          set -euo pipefail
          echo "CARGO_BUILD_BUILD_DIR=$RUNNER_TEMP/archive-linux/build" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/archive-linux/target" >> "$GITHUB_ENV"

      - name: Install protoc (pinned, matches mise.toml)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "36.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Download source-bound candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ci-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/archive-linux/candidate

      - name: Archive-mode binary build (Linux GNU)
        run: |
          set -euo pipefail
          python3 scripts/release_checks.py binary-build --source archive --target x86_64-unknown-linux-gnu \
            --inventory "${{ runner.temp }}/archive-linux/candidate/inventory.json" \
            --package-dir "${{ runner.temp }}/archive-linux/candidate" \
            --output "${{ runner.temp }}/archive-linux/output" \
            --toolchain 1.98.1

      - name: Notices + bundle
        id: stage
        run: |
          set -euo pipefail
          OUT="${{ runner.temp }}/archive-linux/output"
          python3 scripts/release_checks.py notices --build-inputs "$OUT/build-inputs.json" --output "$OUT/notices"
          python3 scripts/release_checks.py bundle --binaries "$OUT/binaries" --provenance "$OUT/build-provenance.json" --notices "$OUT/notices" --output "$OUT/staged-bundle" --timestamp "$(date +%s)"
          ARCHIVES=( "$OUT/staged-bundle"/*.tar.gz )
          if [ "${#ARCHIVES[@]}" -ne 1 ]; then
            echo "::error::expected exactly one Linux bundle tarball"
            exit 1
          fi
          echo "bundle=$(basename "${ARCHIVES[0]}")" >> "$GITHUB_OUTPUT"

      - name: Upload Linux bundle
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ci-linux-bundle-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/archive-linux/output/staged-bundle/
          if-no-files-found: error
          retention-days: 14

  # ── Tier 0j: archive-mode Windows binary + notices + bundle ──────────────────
  # Stage B: cross-builds the Windows MSVC set (daemon/CLI/DLL plus
  # cross_width_smoke.exe) from the source-bound candidate via cargo-xwin
  # on Ubuntu, then collects notices and stages the deterministic ZIP.
  # Native execution happens in smoke-bundle-windows; this job only
  # cross-compiles and inspects, like windows-client-llp64.
  archive-binary-windows:
    name: Archive binary build (Windows MSVC) + notices/bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: package-candidate
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
    outputs:
      bundle: ${{ steps.stage.outputs.bundle }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Both Cargo directories are isolated: the global build.build-dir
      # config makes a target dir alone insufficient.
      - name: Isolate Cargo build and target directories
        run: |
          set -euo pipefail
          echo "CARGO_BUILD_BUILD_DIR=$RUNNER_TEMP/archive-windows/build" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/archive-windows/target" >> "$GITHUB_ENV"

      - name: Install LLVM (clang/lld/llvm-lib) + nasm
        run: |
          sudo apt-get update -qq
          # llvm-lib (MSVC librarian) lets cc-rs cross-build ring for
          # windows-msvc (same prerequisite as windows-client-llp64).
          sudo apt-get install -y clang lld llvm nasm

      - name: Install protoc (pinned, matches mise.toml)
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "36.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned toolchain with Windows MSVC target
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-xwin
        run: cargo install cargo-xwin --version 0.23.1 --locked

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Download source-bound candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ci-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/archive-windows/candidate

      - name: Archive-mode binary build (Windows MSVC)
        run: |
          set -euo pipefail
          python3 scripts/release_checks.py binary-build --source archive --target x86_64-pc-windows-msvc \
            --inventory "${{ runner.temp }}/archive-windows/candidate/inventory.json" \
            --package-dir "${{ runner.temp }}/archive-windows/candidate" \
            --output "${{ runner.temp }}/archive-windows/output" \
            --toolchain 1.98.1

      - name: Notices + bundle
        id: stage
        run: |
          set -euo pipefail
          OUT="${{ runner.temp }}/archive-windows/output"
          python3 scripts/release_checks.py notices --build-inputs "$OUT/build-inputs.json" --output "$OUT/notices"
          python3 scripts/release_checks.py bundle --binaries "$OUT/binaries" --provenance "$OUT/build-provenance.json" --notices "$OUT/notices" --output "$OUT/staged-bundle" --timestamp "$(date +%s)"
          ARCHIVES=( "$OUT/staged-bundle"/*.zip )
          if [ "${#ARCHIVES[@]}" -ne 1 ]; then
            echo "::error::expected exactly one Windows bundle ZIP"
            exit 1
          fi
          echo "bundle=$(basename "${ARCHIVES[0]}")" >> "$GITHUB_OUTPUT"

      - name: Upload Windows bundle
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ci-windows-bundle-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/archive-windows/output/staged-bundle/
          if-no-files-found: error
          retention-days: 14

  # ── Tier 0k: Alpine APK build/install/sign smoke ─────────────────────────────
  # Stage B: builds the Alpine APK carrier from this checkout, verifies
  # the exact APK set (own/upstream notices, inventory, provenance,
  # materials, payload hashes), proves each subpackage installs and
  # deinstalls individually in a scratch container, then installs the
  # APKs all together, verifies the installed daemon/shim/CLI hashes
  # against the APK payload bytes, and runs a real SoftHSM
  # session/login/keygen/RSA-sign flow through the installed daemon +
  # shim. Workspace APK output is CI smoke evidence,
  # not an eligible registry-source release asset. Full Amazon RPM
  # build/install was not run locally and is NOT covered by this gate.
  smoke-apk-alpine:
    name: Smoke Alpine APK (build/install/sign)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: fmt
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build Alpine APK carrier image
        run: |
          set -euo pipefail
          docker build --progress=plain \
            --build-arg "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg "GIT_COMMIT=${{ github.sha }}" \
            -f packaging/alpine/Dockerfile.alpine \
            -t "pkcs11-proxy-ng-apk-smoke:${{ github.sha }}" .

      - name: Extract APK set from carrier
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/apk-smoke/apk"
          CONTAINER="$(docker create "pkcs11-proxy-ng-apk-smoke:${{ github.sha }}" /bin/true)"
          docker cp "$CONTAINER:/apk" "${{ runner.temp }}/apk-smoke/"
          docker rm "$CONTAINER"
          find "${{ runner.temp }}/apk-smoke/apk" -name '*.apk' | sort

      - name: Verify APK set (notices/provenance/materials/hashes)
        run: |
          set -euo pipefail
          python3 scripts/ci-package-smoke.py apk-verify \
            --apk-dir "${{ runner.temp }}/apk-smoke/apk" \
            --hash-output "${{ runner.temp }}/apk-smoke/apk/payload-hashes.json"

      - name: Individual install/remove round-trip
        run: |
          set -euo pipefail
          for pkg in pkcs11-proxy-ng-shim pkcs11-proxy-ng-daemon pkcs11-proxy-ng-cli pkcs11-proxy-ng-compat; do
            case "$pkg" in
              pkcs11-proxy-ng-shim) expect=/usr/lib/pkcs11/libpkcs11_proxy_ng_shim.so ;;
              pkcs11-proxy-ng-daemon) expect=/usr/bin/pkcs11-proxy-ng ;;
              pkcs11-proxy-ng-cli) expect=/usr/bin/pkcs11-proxy-ng-cli ;;
              pkcs11-proxy-ng-compat) expect=/usr/lib/libpkcs11-proxy.so ;;
            esac
            docker run --rm \
              -v "${{ runner.temp }}/apk-smoke/apk:/apk:ro" \
              "alpine:3.23@sha256:85fe1e81d6758c208f3e1eed4338a1997e19d4be002d4dd32d3100c9a8c010a0" \
              sh -eu -c "apk --no-cache add --allow-untrusted --repository /apk $pkg && test -e $expect && apk del $pkg && test ! -e $expect"
          done

      - name: Installed provider smoke (SoftHSM sign)
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/apk-smoke/work"
          docker run --rm \
            -v "${{ runner.temp }}/apk-smoke/apk:/apk:ro" \
            -v "$GITHUB_WORKSPACE/scripts:/smoke-scripts:ro" \
            -v "${{ runner.temp }}/apk-smoke/work:/smoke-work" \
            "alpine:3.23@sha256:85fe1e81d6758c208f3e1eed4338a1997e19d4be002d4dd32d3100c9a8c010a0" \
            sh -eu -c 'apk --no-cache add --allow-untrusted --repository /apk pkcs11-proxy-ng-shim pkcs11-proxy-ng-daemon pkcs11-proxy-ng-cli pkcs11-proxy-ng-compat && apk --no-cache add softhsm opensc python3 && python3 /smoke-scripts/ci-package-smoke.py installed-verify --daemon /usr/bin/pkcs11-proxy-ng --shim /usr/lib/pkcs11/libpkcs11_proxy_ng_shim.so --cli /usr/bin/pkcs11-proxy-ng-cli --expected-hashes /apk/payload-hashes.json --record-out /smoke-work/installed-hashes.json && python3 /smoke-scripts/ci-package-smoke.py installed-smoke --daemon /usr/bin/pkcs11-proxy-ng --shim /usr/lib/pkcs11/libpkcs11_proxy_ng_shim.so --cli /usr/bin/pkcs11-proxy-ng-cli --workdir /smoke-work'

      - name: Upload APK smoke evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: smoke-apk-logs-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/apk-smoke/work/
            ${{ runner.temp }}/apk-smoke/apk/
          retention-days: 14

  # ── Tier 0l: Linux bundle smoke (extracted paths, provider-backed) ──────────
  # Stage B: extracts the exact Linux GNU bundle tarball staged above,
  # checks hashes/materials against its provenance, and runs the
  # extracted daemon/shim/CLI through a real SoftHSM
  # session/login/keygen/RSA-sign flow. Uses only the downloaded bundle
  # paths — never workspace binaries.
  smoke-bundle-linux:
    name: Smoke Linux bundle (extracted paths)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: archive-binary-linux
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install SoftHSM2 + pkcs11-tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y softhsm2 opensc

      - name: Download Linux bundle
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ci-linux-bundle-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smoke-linux/bundle

      - name: Extracted-bundle provider smoke
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/smoke-linux/work"
          python3 scripts/ci-package-smoke.py linux-bundle \
            --bundle "${{ runner.temp }}/smoke-linux/bundle/${{ needs.archive-binary-linux.outputs.bundle }}" \
            --workdir "${{ runner.temp }}/smoke-linux/work"

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: smoke-linux-logs-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smoke-linux/work/
          retention-days: 14

  # ── Tier 0m: Windows bundle smoke (native runner, provider-backed) ──────────
  # Stage B: on a native windows-2022 runner, extracts the exact Windows
  # MSVC ZIP staged above and executes the packaged daemon/CLI plus the
  # shim DLL through a real provider-backed session (pinned SoftHSM
  # archive, scratch token, cross_width_smoke.exe — which needs a live
  # configured daemon/provider and is not a standalone DLL-load test).
  # The existing Ubuntu/cargo-xwin LLP64 job is cross-compilation only
  # and is NOT this native artifact smoke. Windows CRT prerequisites use
  # the runner's own MSVC redist via PATH; no runtime DLLs are bundled.
  smoke-bundle-windows:
    name: Smoke Windows bundle (native)
    runs-on: windows-2022
    timeout-minutes: 60
    needs: archive-binary-windows
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Same CRT prerequisite as cross-platform.yml: the pinned SoftHSM
      # DLLs and the MSVC-built binaries need the desktop CRT, exposed
      # via PATH from the VS installation (never the hanging vc_redist
      # installer, never bundled DLLs).
      - name: Expose MSVC x64 runtime (Windows)
        run: |
          VSWHERE="C:/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          VSDIR=$("$VSWHERE" -latest -property installationPath | tr -d '\r')
          REDIST_DLL=$(find "$VSDIR/VC/Redist/MSVC" -path '*x64*' -name 'vcruntime140.dll' -not -path '*onecore*' 2>/dev/null | sort -V | tail -1)
          if [ -z "$REDIST_DLL" ]; then
            echo "no x64 vcruntime140.dll under $VSDIR/VC/Redist/MSVC"
            exit 1
          fi
          REDIST=$(dirname "$REDIST_DLL")
          echo "$REDIST" >> "$GITHUB_PATH"
          echo "MSVC x64 redist: $REDIST"
        shell: bash

      - name: Download Windows bundle
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ci-windows-bundle-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smoke-windows/bundle

      - name: Native ZIP provider smoke
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke-windows/work"
          python3 scripts/ci-package-smoke.py windows-bundle \
            --bundle "$RUNNER_TEMP/smoke-windows/bundle/${{ needs.archive-binary-windows.outputs.bundle }}" \
            --workdir "$RUNNER_TEMP/smoke-windows/work"
        shell: bash

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: smoke-windows-logs-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smoke-windows/work/
          retention-days: 14

  # ── Tier 0z: fail-closed aggregate ──────────────────────────────────────────
  # Stage B: succeeds only when every required job above succeeded. Any
  # skipped/cancelled/failed/missing job refuses via the ci-results
  # guard — a red gate can never become a green aggregate, and no
  # publication call may proceed on a partial gate set.
  ci-success:
    name: CI success (fail-closed aggregate)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [fmt, audit, deny, packaging-smoke, shellcheck, build-and-test, msrv, narrow-client-i686, windows-client-llp64, musl-x86_64, package-candidate, archive-binary-linux, archive-binary-windows, smoke-apk-alpine, smoke-bundle-linux, smoke-bundle-windows]
    if: always()
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Refuse unless every required job succeeded
        run: |
          set -euo pipefail
          python3 scripts/release_checks.py ci-results --needs-json '${{ toJSON(needs) }}'
