# Thales Luna Network HSM vendor mechanism extensions.
# Use with: PKCS11_PROXY_MECHANISMS=/path/to/thales-luna.toml
#
# Reference: Luna Client SDK cryptoki_v2.h
# Vendor base: CKM_VENDOR_DEFINED (0x80000000)
#
# NOTE: IDs below follow the Luna SDK header naming; cross-check exact
# hex values against your client version (C_GetMechanismList on the HSM
# is authoritative). Entries whose shape is marked NOT-YET-IMPLEMENTED
# are commented out (unknown shapes fail registry load, W1-L8-06);
# uncomment them once backend support lands.
#
# NOTE (W1-L8-06): `parameterless` must stay a single top-level list
# (before the first [[params]]): TOML attaches a bare key written after
# a [[params]] header to that table, where the strict registry loader
# rejects it — and duplicate top-level keys are invalid TOML.

# --- Korean algorithms (parameterless) ---
# --- Legacy SHA-224 (parameterless, pre-standardization) ---
# --- ARIA (parameterless; Korean AES alternative) ---
# --- EdDSA keygen (parameterless, pre-standardization) ---
# --- Payment / DUKPT (parameterless) ---
parameterless = [
  0x80000100, # CKM_HAS160
  0x80000101, # CKM_KCDSA_KEY_PAIR_GEN
  0x80000102, # CKM_KCDSA_HAS160
  0x80000109, # CKM_KCDSA_SHA1
  0x80000103, # CKM_SEED_KEY_GEN
  0x80000104, # CKM_SEED_ECB
  0x80000107, # CKM_SEED_MAC
  0x80000110, # CKM_SHA224_RSA_PKCS_OLD
  0x80000112, # CKM_SHA224_OLD
  0x80000113, # CKM_SHA224_HMAC_OLD
  0x80000115, # CKM_SHA224_KEY_DERIVATION_OLD
  0x80000130, # CKM_ARIA_KEY_GEN
  0x80000131, # CKM_ARIA_ECB
  0x80000138, # CKM_ARIA_MAC
  0x80000139, # CKM_ARIA_MAC_GENERAL
  0x80000C02, # CKM_EDDSA_NACL_KEY_PAIR_GEN
  0x80000611, # CKM_DUKPT_IPEK_DERIVE
  0x80000612, # CKM_DUKPT_PIN_ENCRYPT
]

# SEED CBC uses IV params
[[params]]
shape = "iv"
mechanisms = [0x80000105, 0x80000106]  # CKM_SEED_CBC, CKM_SEED_CBC_PAD

# SEED CBC encrypt data
[[params]]
shape = "seed_cbc_encrypt_data"
mechanisms = [0x80000108]  # CKM_SEED_CBC_ENCRYPT_DATA

[[params]]
shape = "rsa_pss"
mechanisms = [0x80000111]  # CKM_SHA224_RSA_PKCS_PSS_OLD

# --- ARIA CBC (Korean AES alternative) ---
[[params]]
shape = "iv"
mechanisms = [0x80000132, 0x80000133]  # CKM_ARIA_CBC, CKM_ARIA_CBC_PAD

# --- EdDSA (pre-standardization) ---
[[params]]
shape = "eddsa"
mechanisms = [0x80000C03]  # CKM_EDDSA (with optional context)

# --- Object cloning (CPv4) ---
# NOT-YET-IMPLEMENTED(vendor_object_extract): backend FFI reconstruction
# needs the Luna CPv4 C struct layout from cryptoki_v2.h.
# Commented out: unknown shapes fail registry load loudly (W1-L8-06) —
# uncomment once the shape ships.
# [[params]]
# shape = "vendor_object_extract"
# mechanisms = [0x80000208]  # CKM_CPV4_EXTRACT

# NOT-YET-IMPLEMENTED(vendor_object_insert): backend FFI reconstruction
# needs the Luna CPv4 C struct layout from cryptoki_v2.h.
# Commented out: unknown shapes fail registry load loudly (W1-L8-06) —
# uncomment once the shape ships.
# [[params]]
# shape = "vendor_object_insert"
# mechanisms = [0x80000209]  # CKM_CPV4_INSERT

# --- ECIES ---
# NOT-YET-IMPLEMENTED(ecies): backend FFI reconstruction needs the vendor
# C struct layout (cryptoki-sys has no CK_ECIES_PARAMS).
# Commented out: unknown shapes fail registry load loudly (W1-L8-06) —
# uncomment once the shape ships.
# [[params]]
# shape = "ecies"
# mechanisms = [0x80000A00]  # CKM_ECIES
