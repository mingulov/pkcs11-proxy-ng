# BouncyHSM BLAKE2B HMAC vendor mechanism extensions.
# Use with: PKCS11_PROXY_MECHANISMS=/path/to/bouncyhsm-blake2b.toml
# (or layer it under the daemon's mechanism_params.toml via `include`).
#
# BouncyHSM advertises keyed BLAKE2B HMAC (_GENERAL) mechanisms that take
# the truncated MAC length as a single CK_ULONG — the same layout as the
# proxy's "mac_general" shape. They stay operator opt-in (not defaults):
# the 0x40xx IDs are provider-assigned, not OASIS-standard, so enabling
# them is a per-deployment decision. Wave 3 F2.
#
# Reference: BouncyHSM mechanism list (BLAKE2B_*_HMAC_GENERAL).

[[params]]
shape = "mac_general"
mechanisms = [
    0x400E, # CKM_BLAKE2B_160_HMAC_GENERAL (BouncyHSM)
    0x4013, # CKM_BLAKE2B_256_HMAC_GENERAL (BouncyHSM)
    0x4018, # CKM_BLAKE2B_384_HMAC_GENERAL (BouncyHSM)
    0x401D, # CKM_BLAKE2B_512_HMAC_GENERAL (BouncyHSM)
]
