# pkcs11-proxy-ng — STAGING deployment.
#
# mTLS, NSS softokn backend, INFO tracing.  Mirrors prod's transport
# posture but uses a software token so the rest of the staging
# environment doesn't burn HSM capacity.
#
# Env vars expected:
#   RUST_LOG=pkcs11_proxy_ng=info
#   LOG_FORMAT=json
#
# File-permission requirements:
#   server_key   0600 (owner-only; daemon refuses to start otherwise)
#   server_cert  0644 OK
#   ca_cert      0644 OK
#   proxy.toml   0644 OK

[backend]
module = "/usr/lib64/libsoftokn3.so"
# initialize_args = "configdir='sql:/var/lib/nssdb' ..." # via env if needed

[proxy]
request_timeout_secs = 60
startup_timeout_secs = 30
shutdown_grace_secs = 10
backend_health_consecutive_failures = 3
max_concurrent_backend_calls = 100
max_blocking_threads = 256
# Match the deployment lease policy so staging behaves like prod.
lease_seconds = 30
# HTTP/2 keepalive — staging tests rolling-restart behaviour.
http2_keepalive_interval_secs = 15
http2_keepalive_timeout_secs = 5
# Reject NULL data pointers (len>0) and NULL mechanisms before the backend module.
# OFF by default (ADR-0010 transparent forwarding). Enable for modules that crash on them.
# sanitize_inputs = true

[listener.remote]
bind = "0.0.0.0:7512"
auth = "mtls"
ca_cert = "/etc/pkcs11-proxy-ng/tls/ca.crt"
server_cert = "/etc/pkcs11-proxy-ng/tls/server.crt"
server_key = "/etc/pkcs11-proxy-ng/tls/server.key"
allow_insecure_tcp = false

[auth]
# Explicit grants even in staging: no allow-all baseline. Bare and rich
# grants may mix in one policy — the bare form keeps the runtime
# bare-grant default (extraction allowed, all classes/mechanisms).
allow_all_authenticated = false

[[auth.policy]]
# Staging client identity (SPKI pin — replace with your own). The
# daemon authenticates the mTLS peer; this policy decides what the
# authenticated identity may touch.
identity = "x509:spki=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
tokens = [
  # Bare grant: full use of the staging token (runtime default).
  "label:staging-token",
  # Rich grant alongside: the shared CI token is use-only, so CI keys
  # can never leave the token even though the staging grant above
  # permits extraction.
  { token = "label:ci-shared", extract = "deny" },
]

[rate_limit]
# Same knobs as prod, looser for test traffic (absent section = no
# limiting; 0 is rejected at startup).
per_principal_max_in_flight = 256
per_principal_max_sessions = 64
per_slot_failed_login_budget = 50
per_slot_failed_login_cooldown_secs = 60

[mechanisms]
config_path = "/etc/pkcs11-proxy-ng/mechanism_params.toml"
