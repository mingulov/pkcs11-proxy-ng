# pkcs11-proxy-ng — PRODUCTION deployment.
#
# mTLS, real HSM backend placeholder, WARN tracing, higher concurrency.
# Operator MUST replace `backend.module` with the real HSM .so before
# starting the daemon (the placeholder value causes load-time refusal).
#
# Env vars (k8s pod spec):
#   RUST_LOG=pkcs11_proxy_ng=warn,pkcs11_proxy_ng_backend=warn
#   LOG_FORMAT=json
#
# File-permission requirements:
#   server_key   0600 — daemon refuses to start otherwise
#
# Recommended k8s readiness probe (grpc-health-probe):
#   exec: ["/usr/bin/pkcs11-proxy-ng-cli", "--endpoint",
#          "http://127.0.0.1:7512", "health"]

[backend]
# Replace with the real HSM client .so path before deploying.
# The shipped placeholder fails fast at startup — that's intentional.
module = "/CHANGE_ME/path/to/backend.so"
# initialize_args = "credentials=/run/secrets/hsm-creds" # use env if it contains a secret

[proxy]
# Production runs longer-lived contexts; default 30s is fine but
# tune up if your apps do heavy session reuse.
lease_seconds = 30
# Generous concurrency — real HSMs handle parallel calls well.
# Tune max_concurrent_backend_calls based on HSM capacity rather than
# blindly increasing it: HSMs typically refuse > 256 simultaneous
# operations and the circuit breaker should trip BEFORE the HSM does.
max_concurrent_backend_calls = 256
max_blocking_threads = 512
# Longer timeout for slow-but-legitimate HSM operations like keygen.
request_timeout_secs = 60
startup_timeout_secs = 60
# Match k8s terminationGracePeriodSeconds (set this <= terminationGracePeriodSeconds).
shutdown_grace_secs = 30
backend_health_consecutive_failures = 3
http2_keepalive_interval_secs = 15
http2_keepalive_timeout_secs = 5
# Cap the registry-probe rate per peer when the trust model widens
# beyond intra-VPC (FOLLOWUP-rate-limit). 0 disables; bump as needed.
rate_limit_get_backend_interfaces = 0
rate_limit_window_secs = 1
# Reject NULL data pointers (len>0) and NULL mechanisms before the backend module.
# OFF by default (ADR-0010 transparent forwarding). Enable for modules that crash on them.
# sanitize_inputs = true

[listener.remote]
bind = "0.0.0.0:7512"
auth = "mtls"
ca_cert = "/etc/pkcs11-proxy-ng/tls/ca.crt"
server_cert = "/etc/pkcs11-proxy-ng/tls/server.crt"
server_key = "/etc/pkcs11-proxy-ng/tls/server.key"
allow_insecure_tcp = false

[auth]
# Explicit grants only: every mTLS identity is named, with the token(s)
# it may use. allow_all stays OFF — flipping it true would silently
# supersede these grants (and the daemon refuses allow-all on any
# auth="none" listener). (Legacy DN identity form,
# "x509:issuer=...;subject=...", is deprecated: it still parses but
# logs a migration warning per key — prefer SPKI pins.)
allow_all_authenticated = false

[[auth.policy]]
# mTLS client identity: SPKI pin of the client certificate. Replace
# with your own fingerprint (`openssl x509 -in client.crt -pubkey
# -noout | openssl pkey -pubin -outform DER | openssl dgst -sha256`).
identity = "x509:spki=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
tokens = [
  # Rich grant: use-only access to AES keys on the primary HSM token —
  # extraction explicitly denied, AEAD use only. (Inline tables stay on
  # one line — TOML has no multi-line inline tables.)
  { token = "label:primary-hsm", classes = ["secret_key"], mechanisms = ["CKM_AES_GCM"], extract = "deny" },
]

[rate_limit]
# Deliberate quotas (every knob opt-in: an absent section means no
# limiting at all, and 0 is rejected at startup). Sized for one HSM
# partition behind this daemon — re-tune per deployment.
per_principal_max_in_flight = 64
per_principal_max_sessions = 16
per_slot_failed_login_budget = 10
per_slot_failed_login_cooldown_secs = 300

[mechanisms]
# Vendor extensions (CloudHSM, Thales) declared in this file; the
# daemon reloads it on SIGHUP per the runbook's "Updating mechanism
# config" section.
config_path = "/etc/pkcs11-proxy-ng/mechanism_params.toml"
